<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스크린골프 일지 정산</title>
<style>
  :root{
    --cash:#8bc34a;      /* 현금 - 초록 형광펜 */
    --cash-bg:#e8f5d9;
    --card:#f06292;      /* 카드 - 분홍 형광펜 */
    --card-bg:#fde3ec;
    --transfer:#ffca28;  /* 이체 - 노랑 형광펜 */
    --transfer-bg:#fff6da;
    --ink:#222;
    --line:#d8d8d8;
    --bar:#6b6b6b;
    --bg:#f4f4f2;
    --card-white:#fff;
    --danger:#e0453d;
    --accent:#2f6fed;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding:16px;
  }
  h1{font-size:20px;margin:0 0 12px;}
  .topbar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    background:var(--card-white);border:1px solid var(--line);border-radius:10px;
    padding:12px 14px;margin-bottom:14px;
  }
  .topbar label{font-size:13px;color:#555;margin-right:4px;}
  .topbar input[type=date], .topbar input[type=text]{
    padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:14px;
  }
  .weekday{font-weight:bold;padding:4px 10px;background:#eef2ff;border-radius:6px;color:var(--accent);}
  .spacer{flex:1;}
  .btn{
    padding:7px 14px;border-radius:7px;border:1px solid var(--line);
    background:#fff;cursor:pointer;font-size:13px;
  }
  .btn:hover{background:#f0f0f0;}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
  .btn.primary:hover{background:#255bcc;}
  .btn.danger{color:var(--danger);border-color:var(--danger);background:#fff;}
  .btn.danger:hover{background:#fdeceb;}
  .btn.small{padding:3px 8px;font-size:12px;}
  .autosave-badge{font-size:12px;color:#888;}

  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px;}
  .tab{
    padding:8px 16px;background:var(--bar);color:#fff;border-radius:6px 6px 0 0;
    cursor:pointer;font-size:13px;font-weight:bold;opacity:0.7;
  }
  .tab.active{opacity:1;background:#333;}

  .room-panel{background:var(--card-white);border:1px solid var(--line);border-radius:0 8px 8px 8px;padding:14px;margin-bottom:18px;}
  .room-summary{font-size:13px;color:#555;margin-bottom:10px;display:flex;gap:14px;flex-wrap:wrap;}
  .room-summary b{color:#222;}

  .visit-card{
    border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:#fafafa;
  }
  .visit-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
  .visit-head input[type=text]{padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px;}
  .visit-head input.customer{width:140px;}
  .visit-head input.phone{width:130px;}

  .payments{display:flex;flex-direction:column;gap:6px;margin:8px 0;}
  .pay-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .pay-row select, .pay-row input{padding:5px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px;}
  .pay-row input.amount{width:100px;text-align:right;}
  .pay-row input.memo{width:165px;}
  .method-btns{display:flex;gap:3px;}
  .method-btn{
    padding:5px 9px;border-radius:6px;border:1px solid var(--line);cursor:pointer;font-size:11px;background:#fff;
  }
  .method-btn.cash.active{background:var(--cash-bg);border-color:var(--cash);font-weight:bold;}
  .method-btn.card.active{background:var(--card-bg);border-color:var(--card);font-weight:bold;}
  .method-btn.transfer.active{background:var(--transfer-bg);border-color:var(--transfer);font-weight:bold;}

  .birdie-row{display:flex;gap:8px;align-items:center;font-size:12px;margin-top:4px;color:#555;}
  .birdie-row input{width:50px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;}

  .visit-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
  .visit-summary-bar{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 2px;border-radius:6px;margin-bottom:4px;}
  .visit-summary-bar:hover{background:#f0f0f0;}
  .collapse-arrow{color:#888;font-size:11px;width:12px;}
  .visit-summary-meta{color:#888;font-size:12px;}

  .add-visit-btn{width:100%;padding:10px;border:2px dashed var(--line);background:transparent;border-radius:8px;cursor:pointer;color:#666;font-size:13px;}
  .add-visit-btn:hover{background:#f0f0f0;}

  .practice-section{background:var(--card-white);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:18px;}
  .practice-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap;}
  .practice-row input.amount{width:100px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;text-align:right;}
  .warn{color:#c9750c;font-size:11px;}

  .summary{background:var(--card-white);border:1px solid var(--line);border-radius:8px;padding:16px;}
  .summary h2{font-size:16px;margin:0 0 10px;}
  table{border-collapse:collapse;width:100%;font-size:13px;}
  table th, table td{border:1px solid var(--line);padding:6px 8px;text-align:right;}
  table th{background:#f0f0f0;}
  table td.label, table th.label{text-align:left;}
  .grand-row td{font-weight:bold;background:#f7f9ff;}
  .method-tag{padding:2px 6px;border-radius:5px;font-size:11px;}
  .method-tag.cash{background:var(--cash-bg);color:#3d6b1a;}
  .method-tag.card{background:var(--card-bg);color:#a02050;}
  .method-tag.transfer{background:var(--transfer-bg);color:#8a6300;}

  .view-toggle{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
  .login-box{flex-direction:column;align-items:stretch;gap:12px;max-width:360px;margin:60px auto;}
  .login-box label{display:block;margin-bottom:4px;font-size:13px;color:#555;}
  .login-box input{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;font-size:14px;}
  .staff-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
  .locked-area{opacity:0.55;pointer-events:none;}
  .lock-banner{background:#fff3cd;border:1px solid #ffe58a;color:#7a5b00;padding:8px 12px;border-radius:8px;margin-bottom:12px;font-size:13px;}
  .lock-banner.admin-mode{background:#e6f4ff;border-color:#a9d4ff;color:#0b4a8f;}

  .board-wrap{overflow-x:auto;background:var(--card-white);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:14px;}
  .board-table{border-collapse:collapse;font-size:11px;user-select:none;}
  .board-table th, .board-table td{border:1px solid var(--line);padding:0;text-align:center;white-space:nowrap;}
  .board-table th{background:#f0f0f0;padding:4px 3px;font-size:10px;font-weight:normal;color:#666;}
  .board-room-col{position:sticky;left:0;background:#f0f0f0;z-index:2;padding:4px 10px !important;text-align:left;font-weight:bold;font-size:12px;}
  .board-cell{width:32px;height:38px;cursor:pointer;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px;}
  .board-cell.free{background:#fff;}
  .board-cell.free:hover{background:#eef7e3;}
  .board-cell.free.selecting{background:var(--accent) !important;opacity:0.5;}
  .board-cell.occupied{color:#7a2050;font-weight:bold;}
  .board-cell.occupied:hover{filter:brightness(0.93);}
  .board-legend{font-size:11px;color:#888;margin-top:8px;}
  .board-cell-demo{display:inline-block;width:12px;height:12px;border:1px solid var(--line);vertical-align:middle;margin:0 4px 0 10px;}
  .board-cell-demo:first-child{margin-left:0;}
  .board-cell-demo.free{background:#fff;}
  .board-cell-demo.occupied{background:var(--card-bg);}

  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:1000;}
  .modal-box{background:#fff;border-radius:10px;padding:20px;width:300px;display:flex;flex-direction:column;gap:6px;}
  .modal-box label{font-size:13px;color:#555;margin-top:8px;}
  .modal-box input, .modal-box select{padding:7px 8px;border:1px solid var(--line);border-radius:6px;font-size:14px;}
  .list-table-wrap{background:var(--card-white);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px;overflow-x:auto;}
  select.month-select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;}
  .row-actions{display:flex;gap:4px;}
  footer{text-align:center;color:#999;font-size:11px;margin-top:20px;}
</style>
</head>
<body>
<h1>🏌️ 스크린골프 일지 정산</h1>
<div id="app"></div>
<footer>모든 데이터는 클라우드(Firestore)에 자동 저장되어 어느 기기에서 접속해도 동일하게 보입니다.</footer>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
const FIREBASE_CONFIG = {
  projectId: "screen-golf-manager",
  appId: "1:94940029914:web:698ed0da783773838596e3",
  storageBucket: "screen-golf-manager.firebasestorage.app",
  apiKey: "AIzaSyA5MhepW5yZ_hLD16POQsnXB_7j4zgDFAM",
  authDomain: "screen-golf-manager.firebaseapp.com",
  messagingSenderId: "94940029914",
};
let db; // set in init() after firebase.initializeApp()

const ROOMS = ['R1','R2','R3','R5','R6','R7','R8','R9'];
const ROOM_LABEL = { R9: 'R9 (지하1층)' };
// Per-room tint for the 상황판(board): a stronger shade for the room-name
// cell, a light version to tint that row's empty slots so a row stays easy
// to trace across many time columns.
const ROOM_COLORS = {
  R1: { label:'#f6c9c9', row:'#fdeeee' },
  R2: { label:'#f7dcbb', row:'#fdf2e2' },
  R3: { label:'#f0ecb0', row:'#faf8de' },
  R5: { label:'#c0e6ae', row:'#e9f7e1' },
  R6: { label:'#b3e4dc', row:'#e2f6f3' },
  R7: { label:'#b7d2f2', row:'#e5eefc' },
  R8: { label:'#cdc0ef', row:'#eee8fb' },
  R9: { label:'#f0bfdd', row:'#fbe7f3' },
};
const WEEKDAYS = ['일','월','화','수','목','금','토'];
const STORAGE_PREFIX = 'sgledger_';
const METHODS = [
  {key:'cash', label:'현금'},
  {key:'card', label:'카드'},
  {key:'transfer', label:'이체'},
];
const PAY_TYPES = [
  {key:'GAME', label:'게임비'},
  {key:'HOLE', label:'홀인원응모(S)'},
  {key:'ETC', label:'기타(음식/음료 등)'},
];
// 상황판: 09:00~24:00을 30분 단위 칸으로 표시
const BOARD_SLOTS = (()=>{
  const slots = [];
  for(let h=9; h<24; h++){
    slots.push(`${String(h).padStart(2,'0')}:00`);
    slots.push(`${String(h).padStart(2,'0')}:30`);
  }
  return slots;
})();
function slotEnd(slot){
  const [h,m] = slot.split(':').map(Number);
  let nh=h, nm=m+30;
  if(nm>=60){ nh+=1; nm=0; }
  return `${String(nh).padStart(2,'0')}:${String(nm).padStart(2,'0')}`;
}
function endTimeOptions(start){
  const opts = [];
  let cur = slotEnd(start);
  while(true){
    opts.push(cur);
    if(cur === '24:00') break;
    cur = slotEnd(cur);
  }
  return opts;
}
function toMinutes(t){ const [h,m] = t.split(':').map(Number); return h*60+m; }
const SESSION_KEY = STORAGE_PREFIX + 'session';
const DEFAULT_ADMIN_PASSWORD = 'daesung1!';
const AUDIT_TYPE_LABEL = {
  STAFF_CHANGE: '담당자 변경(교대 인수인계)',
  CROSS_EDIT: '다른 직원이 작성한 내용 수정',
  CLOSE: '마감 처리',
  ADMIN_EDIT_ON_CLOSED: '마감 후 수정/삭제(관리자)',
  REOPEN: '마감 취소(관리자)',
  PASSWORD_CHANGE: '관리자 비밀번호 변경',
  STAFF_ADDED: '직원 계정 추가',
  STAFF_PW_RESET: '직원 비밀번호 재설정',
  STAFF_REMOVED: '직원 계정 삭제',
};

let session = null; // { role:'admin', name:'admin' } or { role:'staff', name:'홍길동' }
function isAdmin(){ return !!(session && session.role === 'admin'); }

function uid(){ return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function todayStr(){
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
function weekdayLabel(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  return WEEKDAYS[d.getDay()];
}
function fmt(n){ return (Number(n)||0).toLocaleString('ko-KR'); }

function blankLog(date){
  return {
    date, staff:'',
    rooms: Object.fromEntries(ROOMS.map(r=>[r,[]])),
    practice: [],
  };
}
// Shared by the single-date load path and the list-view batch prefetch.
function normalizeLog(parsed){
  ROOMS.forEach(r=>{
    if(!parsed.rooms[r]) parsed.rooms[r]=[];
    // Visits saved before "작성자 기록" existed have no createdBy — best-guess
    // it as whoever this date's 담당자 was at the time, so cross-staff edits
    // on old data can still be detected instead of silently going unlogged.
    parsed.rooms[r].forEach(v=>{ if(!v.createdBy) v.createdBy = parsed.staff || ''; });
  });
  if(!parsed.practice) parsed.practice=[];
  return parsed;
}
async function loadLog(date){
  try{
    const snap = await db.collection('logs').doc(date).get();
    return snap.exists ? normalizeLog(snap.data()) : blankLog(date);
  }catch(e){ console.warn('일지 불러오기 실패:', e); return blankLog(date); }
}
function saveLog(log){
  // Fire-and-forget: state.log in memory is already the source of truth for
  // this session, so callers don't need to wait on the write to finish.
  db.collection('logs').doc(log.date).set(log).catch(err=>console.warn('일지 저장 실패:', err));
}
function deleteLogDate(date){
  return db.collection('logs').doc(date).delete();
}

// ---------- admin auth ----------
async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
const ADMIN_DOC = () => db.collection('config').doc('admin');
async function getAdminHash(){
  const snap = await ADMIN_DOC().get();
  return snap.exists ? snap.data().hash : null;
}
function setAdminHash(hash){
  return ADMIN_DOC().set({ hash });
}
async function ensureAdminHash(){
  if(!(await getAdminHash())){
    await setAdminHash(await sha256(DEFAULT_ADMIN_PASSWORD));
  }
}
async function attemptLogin(id, pw){
  id = (id||'').trim();
  if(!id || !pw){ alert('아이디와 비밀번호를 입력하세요.'); return; }
  if(id === 'admin'){
    const hash = await sha256(pw);
    if(hash === await getAdminHash()){
      session = { role:'admin', name:'admin' };
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
      state.view = 'edit';
      render();
    } else {
      alert('관리자 비밀번호가 올바르지 않습니다.');
    }
    return;
  }
  const staffAcct = (await getStaffList()).find(s=>s.name===id);
  if(!staffAcct){
    alert('등록되지 않은 이름입니다. 관리자에게 계정 등록을 요청하세요.');
    return;
  }
  const hash = await sha256(pw);
  if(hash !== staffAcct.passwordHash){
    alert('비밀번호가 올바르지 않습니다.');
    return;
  }
  session = { role:'staff', name: staffAcct.name };
  sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
  state.view = 'edit';
  render();
}
function logout(){
  session = null;
  sessionStorage.removeItem(SESSION_KEY);
  state.view = 'edit';
  render();
}
async function changeAdminPassword(){
  const oldPw = prompt('현재 비밀번호를 입력하세요');
  if(oldPw===null) return;
  const hash = await sha256(oldPw);
  if(hash !== await getAdminHash()){ alert('현재 비밀번호가 올바르지 않습니다.'); return; }
  const newPw = prompt('새 비밀번호를 입력하세요');
  if(newPw===null || newPw.trim()==='') return;
  const confirmPw = prompt('새 비밀번호를 한 번 더 입력하세요');
  if(confirmPw !== newPw){ alert('입력한 두 비밀번호가 서로 다릅니다. 다시 시도해주세요.'); return; }
  await setAdminHash(await sha256(newPw));
  addAudit(state.currentDate, 'PASSWORD_CHANGE', '관리자 비밀번호가 변경됨');
  alert('비밀번호가 변경되었습니다.');
  render();
}

// ---------- staff accounts (admin-managed) ----------
async function getStaffList(){
  const snap = await db.collection('staff').get();
  return snap.docs.map(d=>d.data());
}
function setStaffDoc(staff){
  return db.collection('staff').doc(staff.id).set(staff);
}
function deleteStaffDoc(id){
  return db.collection('staff').doc(id).delete();
}
async function addStaffAccount(){
  const name = prompt('추가할 직원 이름을 입력하세요');
  if(name===null || name.trim()==='') return;
  const trimmed = name.trim();
  if(trimmed === 'admin' || state.adminData.staffList.some(s=>s.name===trimmed)){
    alert('이미 사용 중인 이름입니다.');
    return;
  }
  const pw = prompt(`"${trimmed}"님의 초기 비밀번호를 입력하세요`);
  if(pw===null || pw.trim()==='') return;
  const staff = { id: uid(), name: trimmed, passwordHash: await sha256(pw) };
  await setStaffDoc(staff);
  state.adminData.staffList.push(staff);
  addAudit('-', 'STAFF_ADDED', `직원 "${trimmed}" 추가됨`);
  render();
}
async function resetStaffPassword(id){
  const s = state.adminData.staffList.find(x=>x.id===id);
  if(!s) return;
  const pw = prompt(`"${s.name}"님의 새 비밀번호를 입력하세요`);
  if(pw===null || pw.trim()==='') return;
  s.passwordHash = await sha256(pw);
  await setStaffDoc(s);
  addAudit('-', 'STAFF_PW_RESET', `직원 "${s.name}" 비밀번호 재설정됨`);
  alert('비밀번호가 변경되었습니다.');
  render();
}
async function removeStaffAccount(id){
  const s = state.adminData.staffList.find(x=>x.id===id);
  if(!s) return;
  if(!confirm(`직원 "${s.name}" 계정을 삭제할까요? 이 직원은 더 이상 로그인할 수 없습니다.`)) return;
  await deleteStaffDoc(id);
  state.adminData.staffList = state.adminData.staffList.filter(x=>x.id!==id);
  addAudit('-', 'STAFF_REMOVED', `직원 "${s.name}" 삭제됨`);
  render();
}

// ---------- audit log ----------
function addAudit(date, type, detail){
  db.collection('audit').add({ ts: new Date().toISOString(), date, type, detail })
    .catch(err=>console.warn('감사 로그 기록 실패:', err));
}
async function getAudit(){
  const snap = await db.collection('audit').orderBy('ts','desc').get();
  return snap.docs.map(d=>d.data());
}
function commitStaffAudit(newVal, prevVal){
  if(prevVal !== undefined && prevVal.trim() !== '' && prevVal !== newVal){
    addAudit(state.log.date, 'STAFF_CHANGE', `${prevVal} → ${newVal}`);
  }
}
// Flags edits to a visit made by someone other than whoever originally
// created it (v.createdBy), so a later admin review can see that content
// another employee entered was touched by someone else.
function noteCrossStaffEdit(room, v, actionDesc){
  if(!session || !v || !v.createdBy || v.createdBy === session.name) return;
  addAudit(state.log.date, 'CROSS_EDIT', `${session.name}님이 ${v.createdBy}님이 작성한 ${ROOM_LABEL[room]||room} 예약("${v.customer||'이름없음'}")의 ${actionDesc}`);
}

// ---------- day close / lock ----------
function isLocked(){
  return !!(state.log && state.log.closed) && !isAdmin();
}
// Blocks the edit if locked (alerts + reverts UI). Also logs an audit trail
// entry when an admin edits an already-closed day, so a later admin review
// can see that a closed day's figures were touched after close.
function guardEdit(){
  if(state.log.closed && !isAdmin()){
    alert('마감된 일지입니다. 관리자만 수정할 수 있습니다.');

  }

}
// Lighter guard for quiet (per-keystroke) text fields: blocks but doesn't
// spam the audit log on every keystroke.
function isBlockedForEdit(){
  if(state.log.closed && !isAdmin()){
    alert('마감된 일지입니다. 관리자만 수정할 수 있습니다.');
    render();
    return true;
  }
  return false;
}

function reopenDay(){

  addAudit(state.log.date, 'REOPEN', `관리자(${session.name})가 마감을 취소함 (기존 마감자: ${prevCloser})`);

let lastSavedAt = null;
// Updates the small "last saved" badge directly via the DOM instead of a
// full render() — a full render mid-interval could land while the user is
// composing Korean text and would break IME input.
function markSaved(){
  lastSavedAt = new Date();
  const badge = document.getElementById('lastSavedBadge');
  if(badge) badge.textContent = '✔ 마지막 저장 ' + lastSavedAt.toLocaleTimeString('ko-KR');
}
// Whoever is logged in as staff and actually edits a day's log becomes its
// recorded 담당자 — this replaces manually typing a name, and doubles as
// the handover record between shifts (logged via commitStaffAudit so an
// admin can later see when responsibility for a date changed hands).
function syncStaffOwnership(){
  if(session && session.role==='staff' && state.log.staff !== session.name){
    commitStaffAudit(session.name, state.log.staff);
    state.log.staff = session.name;
  }
}
function persistAndRender(){
  syncStaffOwnership();
  saveLog(state.log);
  markSaved();
  render();
}
// Quiet save: used for free-text fields (Korean/IME input) where a full
// re-render per keystroke would destroy the input node and break IME
// composition. These fields don't affect any computed totals, so it's
// safe to persist without redrawing the DOM.
function persistQuiet(){
  syncStaffOwnership();
  saveLog(state.log);
  markSaved();
}
// Safety-net autosave: re-persists the current log every minute even if no
// change event fired, and refreshes the "last saved" badge without a full
// render (see markSaved).
setInterval(()=>{
  if(state.log) saveLog(state.log);

// ---------- board (occupancy grid) ----------
// Drag-to-select: mousedown on a free cell starts tracking; mouseenter over
// subsequent free cells in the same room row extends the selection (entering
// an occupied cell or a different room simply stops extending, it doesn't
// error); mouseup anywhere finalizes and opens the booking dialog with the
// dragged range pre-filled. A plain click (no real drag) behaves exactly as
// before — startSlot===endSlot, so openBookingDialog falls back to its
// default ~1 hour suggestion.
let boardDrag = null; // { room, startSlot, endSlot } while dragging on the board
function startBoardDrag(room, slot){
  boardDrag = { room, startSlot: slot, endSlot: slot };
  highlightBoardDrag();
}
function extendBoardDrag(room, slot){
  if(!boardDrag || boardDrag.room !== room) return;
  boardDrag.endSlot = slot;
  highlightBoardDrag();
}
function highlightBoardDrag(){
  document.querySelectorAll('.board-cell.selecting').forEach(el=>el.classList.remove('selecting'));
  if(!boardDrag) return;
  const lo = Math.min(BOARD_SLOTS.indexOf(boardDrag.startSlot), BOARD_SLOTS.indexOf(boardDrag.endSlot));
  const hi = Math.max(BOARD_SLOTS.indexOf(boardDrag.startSlot), BOARD_SLOTS.indexOf(boardDrag.endSlot));
  for(let i=lo;i<=hi;i++){
    const el = document.querySelector(`.board-cell[data-room="${boardDrag.room}"][data-slot="${BOARD_SLOTS[i]}"]`);
    if(el) el.classList.add('selecting');
  }
}
function finishBoardDrag(){
  if(!boardDrag) return;
  const { room, startSlot, endSlot } = boardDrag;
  document.querySelectorAll('.board-cell.selecting').forEach(el=>el.classList.remove('selecting'));
  boardDrag = null;
  const lo = Math.min(BOARD_SLOTS.indexOf(startSlot), BOARD_SLOTS.indexOf(endSlot));
  const hi = Math.max(BOARD_SLOTS.indexOf(startSlot), BOARD_SLOTS.indexOf(endSlot));
  const start = BOARD_SLOTS[lo];
  // Only pass an explicit end when a real drag happened (more than one slot
  // selected) — a plain click keeps openBookingDialog's own ~1 hour default.
  const end = hi > lo ? slotEnd(BOARD_SLOTS[hi]) : undefined;
  openBookingDialog(room, start, end);
}
function openBookingDialog(room, start, end){
  // Uses isLocked() (not guardEdit()) deliberately: opening the dialog isn't
  // itself a data change, so it shouldn't write an audit entry. guardEdit()
  // runs (and logs, if applicable) once the booking is actually submitted.
  if(isLocked()){
    alert('마감된 일지입니다. 관리자만 예약을 추가할 수 있습니다.');
    return;
  }
  bookingDialog = { room, start, end };
  render();
}

function submitBooking(){
  if(!bookingDialog) return;
  const { room, start } = bookingDialog;
  if(!guardEdit()){ bookingDialog = null; return; }
  const nameEl = document.getElementById('bookingCustomer');
  const phoneEl = document.getElementById('bookingPhone');
  const endEl = document.getElementById('bookingEnd');

  const conflict = visits.some(v=>v.bookingStart && v.bookingEnd && start < v.bookingEnd && end > v.bookingStart);
  if(conflict){ alert('선택한 시간대에 이미 다른 예약이 있습니다. 시간을 다시 선택해주세요.'); return; }

}
// Edits an existing visit's booking range directly from the room panel (not
// just via the board's create dialog), keeping both views in sync. Rejects
// the change with an alert if it would overlap another visit's occupied time.
function setBookingRange(room, visitId, field, value){
  if(!guardEdit()) return;
  const v = getVisit(room, visitId);
  if(field==='start' && value===''){
    const oldRange = v.bookingStart ? `${v.bookingStart}~${v.bookingEnd}` : '미지정';
    delete v.bookingStart;
    delete v.bookingEnd;
    noteCrossStaffEdit(room, v, `예약 시간 해제 (${oldRange} → 미지정)`);
    persistAndRender();
    return;
  }
  let newStart = field==='start' ? value : v.bookingStart;
  let newEnd = field==='end' ? value : v.bookingEnd;
  if(!newEnd || newEnd <= newStart) newEnd = slotEnd(newStart);
  const conflict = state.log.rooms[room].some(other =>
    other.id!==visitId && other.bookingStart && other.bookingEnd &&
    newStart < other.bookingEnd && newEnd > other.bookingStart
  );
  if(conflict){
    alert('이미 다른 손님이 점유하고 있는 시간입니다. 다른 시간을 선택해주세요.');
    render(); // revert the <select> back to the real (unchanged) value
    return;
  }
  const oldRange = v.bookingStart ? `${v.bookingStart}~${v.bookingEnd}` : '미지정';
  v.bookingStart = newStart;
  v.bookingEnd = newEnd;
  noteCrossStaffEdit(room, v, `예약 시간 변경 (${oldRange} → ${newStart}~${newEnd})`);
  persistAndRender();
}

const FIELD_LABEL = { amount:'금액', method:'결제수단', type:'항목 종류' };
function updatePayment(room, visitId, payId, field, value){
  if(!guardEdit()) return;
  const v = getVisit(room, visitId);
  const p = v.payments.find(p=>p.id===payId);
  const newVal = field==='amount' ? (Number(value)||0) : value;
  const hadValue = (Number(p.amount)||0) !== 0; // this payment line already holds a recorded amount
  const changed = p[field] !== newVal;
  if(hadValue && changed){
    if(!confirm(`이미 입력된 ${FIELD_LABEL[field]}을(를) 수정하시겠습니까?`)){
      render(); // reset any premature UI change (e.g. a <select>) back to the real state
      return;
    }
  }
  const oldVal = p[field];
  p[field] = newVal;
  if(changed) noteCrossStaffEdit(room, v, `결제 ${FIELD_LABEL[field]} 수정 (${oldVal===''||oldVal==null?'-':oldVal} → ${newVal})`);
  persistAndRender();
}

// ---------- calculations ----------
function computeSummary(log){
  const totals = {cash:0, card:0, transfer:0};
  const roomTotals = {};
  let sgTotal = 0;
  let birdieTotal = 0;
  let birdieCountSum = 0;

  ROOMS.forEach(r=>{
    roomTotals[r] = {cash:0, card:0, transfer:0};
    (log.rooms[r]||[]).forEach(v=>{
      v.payments.forEach(p=>{
        if(p.type==='HOLE') sgTotal += Number(p.amount)||0;
        roomTotals[r][p.method] += Number(p.amount)||0;
        totals[p.method] += Number(p.amount)||0;
      });
      const bc = Number(v.birdieCount)||0;
      birdieCountSum += bc;
      birdieTotal += bc*100;
    });
  });

  const practiceTotals = {cash:0, card:0, transfer:0};
  (log.practice||[]).forEach(p=>{
    practiceTotals[p.method] += Number(p.amount)||0;
    totals[p.method] += Number(p.amount)||0;
  });

  const grandTotal = totals.cash + totals.card + totals.transfer;
  return { totals, roomTotals, sgTotal, birdieTotal, birdieCountSum, practiceTotals, grandTotal };
}

// Walks the 30-min slots left to right and merges consecutive slots that
// belong to the same booking into one wide cell (colspan) so the
// reservation's name is shown once across its full occupied span, not
// truncated per-slot.
function renderBoardRow(room, visits, occupiedColor){
  let html = '';
  let i = 0;
  while(i < BOARD_SLOTS.length){
    const slot = BOARD_SLOTS[i];
    const owner = visits.find(v=>v.bookingStart && v.bookingEnd && slot >= v.bookingStart && slot < v.bookingEnd);
    if(owner && slot === owner.bookingStart){
      const span = Math.max(1, Math.round((toMinutes(owner.bookingEnd) - toMinutes(owner.bookingStart)) / 30));
      const tip = `${owner.customer||''}${owner.phone?' ☎'+owner.phone:''} (${owner.bookingStart}~${owner.bookingEnd})`;
      html += `<td class="board-cell occupied" colspan="${span}" style="background:${occupiedColor};" title="${escAttr(tip)}" onclick="focusVisitFromBoard('${room}','${owner.id}')">${escHtml(owner.customer||'')}</td>`;
      i += span;
    } else if(owner){
      // Defensive fallback for pre-existing overlapping data; normal use never reaches this.
      html += `<td class="board-cell occupied" style="background:${occupiedColor};" title="${escAttr(owner.customer||'')}" onclick="focusVisitFromBoard('${room}','${owner.id}')"></td>`;
      i += 1;
    } else {
      html += `<td class="board-cell free" data-room="${room}" data-slot="${slot}" title="${slot} 예약하기(드래그로 시간대 선택 가능)" onmousedown="startBoardDrag('${room}','${slot}')" onmouseenter="extendBoardDrag('${room}','${slot}')"></td>`;
      i += 1;
    }
  }
  return html;
}

}

const MAX_EXPORT_DAYS = 31; // "최대 1개월치" cap on a single range export
function dateRange(start, end){
  const dates = [];
  const cur = new Date(start + 'T00:00:00');
  const endD = new Date(end + 'T00:00:00');
  const pad = n => String(n).padStart(2,'0');
  while(cur <= endD){
    dates.push(`${cur.getFullYear()}-${pad(cur.getMonth()+1)}-${pad(cur.getDate())}`);
    cur.setDate(cur.getDate()+1);
  }
  return dates;
}
// One sheet's worth of rows for a single date: visit/payment detail rows,
// then a blank separator, then the same room/method summary shown on-screen.
function buildDateSheetRows(log, summary){
  const rows = [['룸','예약시간','예약자','연락처','항목','결제수단','금액','메모']];
  ROOMS.forEach(room=>{
    (log.rooms[room]||[]).forEach(v=>{
      const time = v.bookingStart ? `${v.bookingStart}~${v.bookingEnd}` : '';
      if(v.payments.length===0){
        rows.push([ROOM_LABEL[room]||room, time, v.customer||'', v.phone||'', '', '', '', '']);
      } else {
        v.payments.forEach(p=>{
          rows.push([ROOM_LABEL[room]||room, time, v.customer||'', v.phone||'', payTypeLabel(p.type), methodLabel(p.method), Number(p.amount)||0, p.memo||'']);
        });
      }
    });
  });
  rows.push([]);
  rows.push(['요약','현금','카드','이체','합계']);
  ROOMS.forEach(r=>{
    const rt = summary.roomTotals[r];
    const tot = rt.cash+rt.card+rt.transfer;
    if(tot===0) return;
    rows.push([ROOM_LABEL[r]||r, rt.cash, rt.card, rt.transfer, tot]);
  });
  rows.push(['연습장 매출', summary.practiceTotals.cash, summary.practiceTotals.card, summary.practiceTotals.transfer, summary.practiceTotals.cash+summary.practiceTotals.card+summary.practiceTotals.transfer]);
  rows.push(['총 수입 합계', summary.totals.cash, summary.totals.card, summary.totals.transfer, summary.grandTotal]);
  rows.push([]);
  rows.push(['SG(홀인원 응모) 총액', summary.sgTotal]);
  rows.push(['버디 지급 총액', summary.birdieTotal, `총 ${summary.birdieCountSum}개`]);
  return rows;
}
async function exportRangeToExcel(start, end){
  if(!start || !end){ alert('시작일과 종료일을 선택하세요.'); return; }
  if(start > end){ alert('종료일이 시작일보다 빠를 수 없습니다.'); return; }
  const dates = dateRange(start, end);
  if(dates.length > MAX_EXPORT_DAYS){
    alert(`한 번에 최대 ${MAX_EXPORT_DAYS}일(약 1개월)까지만 받을 수 있습니다. 기간을 줄여주세요.`);
    return;
  }
  const wb = XLSX.utils.book_new();
  for(const date of dates){
    const log = await loadLog(date);
    const summary = computeSummary(log);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(buildDateSheetRows(log, summary)), date);
  }
  const filename = start === end ? `${start}_스크린골프정산.xlsx` : `${start}~${end}_스크린골프정산.xlsx`;
  XLSX.writeFile(wb, filename);
}

    </div>

    <div class="summary" style="margin-bottom:14px;">
      <h2>👥 직원 계정 관리</h2>
      ${staffList.length ? staffList.map(s=>`
        <div class="staff-row">
          <span style="min-width:120px;">${escHtml(s.name)}</span>
          <button class="btn small" onclick="resetStaffPassword('${s.id}')">비밀번호 재설정</button>
          <button class="btn small danger" onclick="removeStaffAccount('${s.id}')">삭제</button>
        </div>
      `).join('') : '<p style="font-size:13px;color:#999;">등록된 직원이 없습니다.</p>'}
      <button class="btn" style="margin-top:6px;" onclick="addStaffAccount()">+ 직원 추가</button>
    </div>

    <div class="list-table-wrap">
      <h2 style="font-size:15px;margin-top:0;">📜 변경 이력 (담당자 교대 · 마감 처리 · 마감 후 수정/삭제 · 비밀번호/계정 변경)</h2>
      <table>
        <tr><th class="label">시각</th><th class="label">날짜</th><th class="label">종류</th><th class="label">내용</th></tr>
        ${audit.length ? audit.map(a=>`
          <tr>
            <td class="label">${new Date(a.ts).toLocaleString('ko-KR')}</td>
            <td class="label">${escHtml(a.date||'-')}</td>
            <td class="label">${escHtml(AUDIT_TYPE_LABEL[a.type]||a.type)}</td>
            <td class="label">${escHtml(a.detail)}</td>
          </tr>
        `).join('') : '<tr><td colspan="4" style="text-align:center;color:#999;">기록 없음</td></tr>'}
      </table>
    </div>
  `;
}

// ---------- escaping ----------
function escHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return escHtml(s); }

(async function init(){
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  await ensureAdminHash();
  try{
    const saved = sessionStorage.getItem(SESSION_KEY);
    if(saved) session = JSON.parse(saved);
  }catch(e){ session = null; }
  state.log = await loadLog(state.currentDate);
  render();
  document.addEventListener('mouseup', ()=>{ if(boardDrag) finishBoardDrag(); });
})();
</script>
</body>
</html>
