// ---------- 마감 시 폴더 백업 ----------
// A web page cannot write to a fixed disk path like C:\스크린골프 on its own —
// there is no API for it, by design. The File System Access API is the only
// route: the user grants one folder once, the handle is kept in IndexedDB
// (handles survive a reload, unlike anything in localStorage), and every 마감
// after that writes into <granted folder>/YYYY-MM/.
//
// This exists on Chromium desktop only. Safari and every iOS browser have no
// such API, so each step below degrades to "no backup" rather than throwing —
// closing the day must work on a phone whether or not a file gets written.
const BACKUP_DB = 'sgledger-backup';
const BACKUP_STORE = 'handles';
const BACKUP_KEY = 'folder';
function backupSupported(){
  return typeof window !== 'undefined' && 'showDirectoryPicker' in window && window.isSecureContext;
}
function idbWithStore(mode, fn){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(BACKUP_DB, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(BACKUP_STORE); };
    req.onerror = ()=>reject(req.error);
    req.onsuccess = ()=>{
      const db = req.result;
      let inner;
      try{
        const tx = db.transaction(BACKUP_STORE, mode);
        inner = fn(tx.objectStore(BACKUP_STORE));
        tx.oncomplete = ()=>{ db.close(); resolve(inner ? inner.result : undefined); };
        tx.onerror = ()=>{ db.close(); reject(tx.error); };
      }catch(e){ db.close(); reject(e); }
    };
  });
}
// Declarations rather than consts so the test harness can swap in a fake
// directory handle — showDirectoryPicker needs a real click and a real folder.
function getBackupFolder(){ return idbWithStore('readonly', s=>s.get(BACKUP_KEY)).catch(()=>null); }
function putBackupFolder(h){ return idbWithStore('readwrite', s=>s.put(h, BACKUP_KEY)); }
function dropBackupFolder(){ return idbWithStore('readwrite', s=>s.delete(BACKUP_KEY)); }

// Granted once, but the browser can drop back to "prompt" between sessions;
// re-asking only works while a click's user activation is still live.
async function backupPermissionOk(dir, interactive){
  if(!dir || typeof dir.queryPermission !== 'function') return false;
  const opts = { mode:'readwrite' };
  if(await dir.queryPermission(opts) === 'granted') return true;
  if(!interactive) return false;
  return await dir.requestPermission(opts) === 'granted';
}
async function chooseBackupFolder(){
  if(!backupSupported()){
    alert('이 브라우저에서는 폴더 자동 저장을 지원하지 않습니다.\n아이폰/사파리에는 해당 기능이 없으니, PC의 크롬 또는 엣지에서 지정해주세요.');
    return;
  }
  try{
    const dir = await window.showDirectoryPicker({ id:'sgledger-backup', mode:'readwrite' });
    await putBackupFolder(dir);
    state.backupFolder = dir.name;
    render();
    alert(`백업 폴더를 "${dir.name}" 으로 지정했습니다.\n앞으로 마감 처리를 하면 이 폴더 안에 월별 폴더(예: ${state.currentDate.slice(0,7)})를 만들어 일지를 저장합니다.`);
  }catch(e){
    if(e && e.name === 'AbortError') return;   // the user just closed the picker
    alert('폴더를 지정하지 못했습니다: ' + ((e && e.message) || e));
  }
}
async function forgetBackupFolder(){
  if(!confirm('마감 시 자동 백업을 해제할까요?\n이미 저장된 파일은 그대로 남습니다.')) return;
  await dropBackupFolder().catch(()=>{});
  state.backupFolder = null;
  render();
}
// Refreshes the label shown in the admin page. Never throws — an unsupported
// browser simply has no folder.
async function refreshBackupFolderName(){
  if(!backupSupported()){ state.backupFolder = null; return; }
  const dir = await getBackupFolder();
  state.backupFolder = dir ? dir.name : null;
}

async function writeBackupFile(dirHandle, name, data){
  const fh = await dirHandle.getFileHandle(name, { create:true });
  const w = await fh.createWritable();
  await w.write(data);
  await w.close();
}
// Two files per day, deliberately: the .xlsx is the one a person opens and
// reads, the .json is the only one that can put the day back exactly as it was
// if the database is ever lost.
async function writeDayBackup(dir, log){
  const month = log.date.slice(0, 7);                      // 2026-08
  const monthDir = await dir.getDirectoryHandle(month, { create:true });
  const summary = computeSummary(log);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(buildDateSheetRows(log, summary)), log.date);
  await writeBackupFile(monthDir, `${log.date} 일지.xlsx`, XLSX.write(wb, { bookType:'xlsx', type:'array' }));
  await writeBackupFile(monthDir, `${log.date} 일지.json`, JSON.stringify(log, null, 2));
  return `${dir.name}/${month}/${log.date} 일지`;
}
// Called from closeDay before it awaits anything else, so the permission
// prompt still counts as coming from the click.
async function backupTargetForClose(){
  if(!backupSupported()) return null;
  const dir = await getBackupFolder();
  if(!dir) return null;
  return (await backupPermissionOk(dir, true)) ? dir : { denied:true };
}
let lastBackup = null;   // {ok, text} — shown next to the 마감됨 badge
async function runCloseBackup(dir, log){
  if(!dir) return;                      // unsupported browser, or no folder set
  if(dir.denied){
    lastBackup = { ok:false, text:'폴더 접근 권한이 거부되어 백업하지 못했습니다.' };
    render();
    alert('일지는 마감됐지만 백업 폴더에 접근할 수 없어 파일을 저장하지 못했습니다.\n관리자 페이지에서 백업 폴더를 다시 지정해주세요.');
    return;
  }
  try{
    lastBackup = { ok:true, text: await writeDayBackup(dir, log) };
    render();
  }catch(e){
    lastBackup = { ok:false, text:(e && e.message) || String(e) };
    render();
    // A backup that silently didn't happen is worse than no backup at all,
    // because it is trusted.
    alert('일지는 마감됐지만 백업 파일을 저장하지 못했습니다.\n\n' + lastBackup.text);
  }
}
// Sits under the 마감 banner so the day's backup state is visible where the
// close itself is, not buried in the admin page.
function renderBackupNote(){
  if(!lastBackup || !state.log || !state.log.closed) return '';
  return lastBackup.ok
    ? `<div class="backup-note">${icon('check')} 백업됨 — ${escHtml(lastBackup.text)}.xlsx / .json</div>`
    : `<div class="backup-note failed">${icon('alert')} 백업하지 못했습니다 — ${escHtml(lastBackup.text)}
         <button class="btn small" onclick="backupCurrentDayNow()">다시 백업</button></div>`;
}
// Re-runs the backup for the date on screen — the way to recover from a failed
// or skipped one without having to un-close and re-close the day.
async function backupCurrentDayNow(){
  if(!state.log){ alert('먼저 일지를 불러와주세요.'); return; }
  if(!backupSupported()){
    alert('이 브라우저에서는 폴더 자동 저장을 지원하지 않습니다.\nPC의 크롬 또는 엣지에서 실행해주세요.');
    return;
  }
  const dir = await getBackupFolder();
  if(!dir){ alert('먼저 백업 폴더를 지정해주세요.'); return; }
  if(!(await backupPermissionOk(dir, true))){ alert('폴더 접근 권한이 없어 저장하지 못했습니다.'); return; }
  try{
    const where = await writeDayBackup(dir, state.log);
    lastBackup = { ok:true, text:where };
    render();
    alert('백업했습니다.\n' + where + '.xlsx / .json');
  }catch(e){
    alert('백업하지 못했습니다: ' + ((e && e.message) || e));
  }
}

async function exportRangeToExcel(start, end){
  if(!start || !end){ alert('시작일과 종료일을 선택하세요.'); return; }
  if(start > end){ alert('종료일이 시작일보다 빠를 수 없습니다.'); return; }
  const dates = dateRange(start, end);
  if(dates.length > MAX_EXPORT_DAYS){
    alert(`한 번에 최대 ${MAX_EXPORT_DAYS}일(약 1개월)까지만 받을 수 있습니다. 기간을 줄여주세요.`);
    return;
  }
  const wb = XLSX.utils.book_new();
  try{
    for(const date of dates){
      const log = await loadLog(date);
      const summary = computeSummary(log);
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(buildDateSheetRows(log, summary)), date);
    }
  }catch(e){
    alert('일지를 불러오지 못해 엑셀 출력을 중단했습니다. 인터넷 연결을 확인하고 다시 시도해주세요.');
    return;
  }
  const filename = start === end ? `${start}_스크린골프정산.xlsx` : `${start}~${end}_스크린골프정산.xlsx`;
  XLSX.writeFile(wb, filename);
}

  return `
    ${renderNav()}

      <h2>${icon("key")} 관리자 비밀번호</h2>

          <b>일지.xlsx</b>(보기용)와 <b>일지.json</b>(복구용)을 저장합니다.
        </p>

          <button class="btn" onclick="chooseBackupFolder()">${state.backupFolder ? '폴더 변경' : '폴더 지정'}</button>
          ${state.backupFolder ? `<button class="btn" onclick="backupCurrentDayNow()">${escHtml(state.currentDate)} 지금 백업</button>` : ''}

// Paged 변경 이력: AUDIT_PAGE_SIZE rows at a time, newest first.
function renderAuditSection(audit){
  const total = audit.length;
  const pageCount = Math.max(1, Math.ceil(total / AUDIT_PAGE_SIZE));
  // Clamp in case the list shrank since the page index was last set.
  const page = Math.min(Math.max(0, state.auditPage), pageCount - 1);
  state.auditPage = page;
  const start = page * AUDIT_PAGE_SIZE;
  const rows = audit.slice(start, start + AUDIT_PAGE_SIZE);
  return `
    <div class="list-table-wrap">
      <h2 style="font-size:15px;margin-top:0;">${icon("history")} 변경 이력 (예약 카드 저장 · 삭제)</h2>
      <p style="font-size:12px;color:#888;margin:0 0 8px;">최근 1개월치만 보관되며, 그보다 오래된 기록은 자동으로 삭제됩니다.</p>
      <table>
        <tr><th class="label">시각</th><th class="label">작업자</th><th class="label">종류</th><th class="label">내용</th></tr>
        ${rows.length ? rows.map(a=>`
          <tr>
            <td class="label">${new Date(a.ts).toLocaleString('ko-KR')}</td>
            <td class="label">${escHtml(a.who || '-')}</td>
            <td class="label">${escHtml(AUDIT_TYPE_LABEL[a.type] || a.type)}</td>
            <td class="label">${escHtml(a.detail || '')}</td>
          </tr>
        `).join('') : '<tr><td colspan="4" style="text-align:center;color:#999;">기록 없음</td></tr>'}
      </table>
      ${total ? `
        <div class="audit-pager">
          <button class="btn small" ${page===0?'disabled':''} onclick="gotoAuditPage(${page-1})">← 이전</button>
          <span>${page+1} / ${pageCount} 페이지 (총 ${total}건)</span>
          <button class="btn small" ${page>=pageCount-1?'disabled':''} onclick="gotoAuditPage(${page+1})">다음 →</button>
        </div>
      ` : ''}
    </div>
  `;
}
function gotoAuditPage(p){
  state.auditPage = p;
  render();
}

// ---------- escaping ----------
function escHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return escHtml(s); }

(async function init(){
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  try{
    await ensureAdminHash();
    try{
      const saved = sessionStorage.getItem(SESSION_KEY);
      if(saved) session = JSON.parse(saved);
    }catch(e){ session = null; }
    state.log = await loadLog(state.currentDate);
    setBase(state.log);
    subscribeLog(state.currentDate);
    render();
  }catch(e){
    console.warn('초기 로딩 실패:', e);
    document.getElementById('header').innerHTML =
      '<div class="app-header"><h1 class="brand">' + brandLogo('edit') + '</h1></div>';
    document.getElementById('app').innerHTML =
      '<div class="summary"><p>서버에 연결하지 못했습니다. 인터넷 연결을 확인해주세요.</p>' +
      '<button class="btn primary" onclick="location.reload()">다시 시도</button></div>';
  }
  document.addEventListener('mouseup', ()=>{ if(boardDrag) finishBoardDrag(); });
  // The per-cell onmouseenter only fires on free cells, so on its own a mouse
  // drag could never shrink a booking from inside itself. Resolving the slot
  // from the pointer position covers both cell kinds.
  document.addEventListener('mousemove', e=>{
    if(!boardDrag) return;
    const p = boardSlotAtPoint(e.clientX, e.clientY);
    if(p) extendBoardDrag(p.room, p.slot);
  });
  // Bound on document (not per-cell) so they survive every re-render.
  // touchmove MUST be non-passive: preventDefault() there is what stops the
  // page and the board from scrolling while a selection is being dragged.
  document.addEventListener('touchstart', onBoardTouchStart, { passive: true });
  document.addEventListener('touchmove',  onBoardTouchMove,  { passive: false });
  document.addEventListener('touchend',   onBoardTouchEnd);
  document.addEventListener('touchcancel', onBoardTouchEnd);
})();
</script>
