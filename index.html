<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>스크린골프 일지 정산</title>
<style>
  :root{
    --cash:#8bc34a;      /* 현금 - 초록 형광펜 */
    --cash-bg:#e8f5d9;
    --card:#f06292;      /* 카드 - 분홍 형광펜 */
    --card-bg:#fde3ec;
    --transfer:#ffca28;  /* 이체 - 노랑 형광펜 */
    --transfer-bg:#fff6da;
    --ink:#1d1d1f;
    --ink-muted:#7a7a7a;
    --line:#e0e0e0;
    --bar:#1d1d1f;
    --bg:#f5f5f7;
    --card-white:#fff;
    --danger:#e0453d;
    --accent:#0066cc;
    --accent-focus:#0071e3;
    --radius-pill:9999px;
    --radius-lg:18px;
    --radius-md:11px;
    --radius-sm:8px;
    --body-pad:16px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding:var(--body-pad);
  }
  h1{font-size:20px;font-weight:600;letter-spacing:-0.02em;margin:0 0 12px;}
  h2{margin:0;font-weight:600;letter-spacing:-0.01em;}
  button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--accent-focus);outline-offset:1px;
  }
  .topbar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    background:var(--card-white);border:1px solid var(--line);border-radius:var(--radius-lg);
    padding:12px 14px;margin-bottom:14px;
  }
  .topbar label{font-size:13px;color:var(--ink-muted);margin-right:4px;}
  .date-row{padding-top:12px;padding-bottom:12px;}
  .topbar input[type=date], .topbar input[type=text]{
    padding:6px 8px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:14px;
  }
  .topbar input[type=date]{-webkit-appearance:none;appearance:none;}
  .weekday{font-weight:600;padding:4px 10px;background:#eef2ff;border-radius:var(--radius-pill);color:var(--accent);white-space:nowrap;flex-shrink:0;}
  .spacer{flex:1;}
  .btn{
    padding:7px 14px;border-radius:var(--radius-sm);border:1px solid var(--line);
    background:#fff;color:var(--ink);cursor:pointer;font-size:13px;white-space:nowrap;
  }
  .btn:hover{background:var(--bg);}
  .btn:active{transform:scale(0.95);}
  .btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);border-radius:var(--radius-pill);padding:7px 16px;}
  .btn.primary:hover{background:var(--accent-focus);}
  .btn.danger{color:var(--danger);border-color:var(--danger);background:#fff;}
  .btn.danger:hover{background:#fdeceb;}
  .btn.small{padding:3px 8px;font-size:12px;}
  .autosave-badge{font-size:12px;color:var(--ink-muted);}

  .tabs{display:flex;gap:2px;flex-wrap:nowrap;overflow-x:auto;margin-bottom:14px;border-bottom:1px solid var(--line);}
  .tab{
    padding:10px 16px;background:transparent;color:var(--ink-muted);border:none;border-bottom:2px solid transparent;
    margin-bottom:-1px;cursor:pointer;font-size:13px;font-weight:600;white-space:nowrap;flex-shrink:0;
  }
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}

  .room-panel{background:var(--card-white);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px;margin-bottom:18px;}
  .room-summary{font-size:13px;color:var(--ink-muted);margin-bottom:10px;display:flex;gap:14px;flex-wrap:wrap;}
  .room-summary b{color:var(--ink);}

  .visit-card{
    border:1px solid var(--line);border-radius:var(--radius-md);padding:12px;margin-bottom:10px;background:#fafafa;
  }
  .visit-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px;}
  .booking-time-label{font-size:12px;color:#888;}
  .visit-head select, .visit-head input[type=text], .visit-head input[type=tel]{
    height:30px;box-sizing:border-box;padding:0 8px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:13px;background:#fff;color:var(--ink);
  }
  .visit-head select{flex:1 1 78px;min-width:60px;}
  .visit-head input.customer{flex:0 0 130px;min-width:0;}
  .visit-head input.phone{flex:1 1 0;min-width:100px;}

  .payments{display:flex;flex-direction:column;gap:6px;margin:8px 0;}
  .pay-row{display:grid;grid-template-columns:130px 1fr;gap:6px 8px;align-items:center;}
  .pay-row select, .pay-row input{box-sizing:border-box;width:100%;height:30px;padding:0 8px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:12px;}
  .pay-row select{
    -webkit-appearance:none;appearance:none;grid-column:1;grid-row:1;padding-right:22px;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink-muted) 50%),linear-gradient(135deg,var(--ink-muted) 50%,transparent 50%);
    background-position:calc(100% - 13px) 55%,calc(100% - 8px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;
  }
  .pay-row input[type=number]{-webkit-appearance:none;appearance:none;-moz-appearance:textfield;}
  .pay-row input[type=number]::-webkit-outer-spin-button, .pay-row input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .pay-row .method-btns{grid-column:2;grid-row:1;}
  .pay-row .amount-wrap{grid-column:1;grid-row:2;display:flex;align-items:center;gap:4px;}
  .pay-row .amount-wrap input.amount{width:auto;flex:1 1 0%;min-width:0;text-align:right;}
  .pay-row input.memo{grid-column:2;grid-row:2;}
  .pay-row .x{grid-column:2;grid-row:3;justify-self:end;padding:0 4px;cursor:pointer;color:#888;}
  .method-btns{display:flex;gap:3px;}
  .method-btn{
    padding:5px 10px;border-radius:var(--radius-pill);border:1px solid var(--line);cursor:pointer;font-size:11px;background:#fff;color:var(--ink);white-space:nowrap;
  }
  .method-btn.cash.active{background:var(--cash-bg);border-color:var(--cash);font-weight:bold;}
  .method-btn.card.active{background:var(--card-bg);border-color:var(--card);font-weight:bold;}
  .method-btn.transfer.active{background:var(--transfer-bg);border-color:var(--transfer);font-weight:bold;}

  .birdie-row{display:flex;gap:8px;align-items:center;font-size:12px;margin-top:4px;color:var(--ink-muted);}
  .birdie-stepper{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;background:#fff;}
  .birdie-stepper button{width:22px;border:none;background:#fff;cursor:pointer;font-size:13px;line-height:1;color:var(--ink);}
  .birdie-stepper button:hover:not(:disabled){background:var(--bg);}
  .birdie-stepper button:disabled{opacity:0.35;cursor:default;}
  .birdie-stepper input{
    width:34px;height:22px;border:none;border-left:1px solid var(--line);border-right:1px solid var(--line);
    text-align:center;padding:0;font-size:12px;-moz-appearance:textfield;appearance:textfield;
  }
  .birdie-stepper input::-webkit-outer-spin-button, .birdie-stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}

  .visit-foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px;}
  .visit-summary-bar{display:flex;align-items:center;gap:8px;cursor:pointer;padding:4px 2px;border-radius:var(--radius-sm);margin-bottom:4px;}
  .visit-summary-bar:hover{background:var(--bg);}
  .collapse-arrow{color:var(--ink-muted);font-size:11px;width:12px;}
  .visit-summary-meta{color:var(--ink-muted);font-size:12px;}
  .unsaved-dot{color:var(--accent);font-size:11px;font-weight:600;white-space:nowrap;margin-left:auto;}
  .btn.saved-flash{background:var(--cash-bg);border-color:var(--cash);color:#3d6b1a;font-weight:bold;}

  .add-visit-btn{width:100%;padding:10px;border:2px dashed var(--line);background:transparent;border-radius:var(--radius-lg);cursor:pointer;color:var(--ink-muted);font-size:13px;}
  .add-visit-btn:hover{background:var(--bg);}

  .practice-section{background:var(--card-white);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px;margin-bottom:18px;}
  .practice-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap;}
  .practice-row input.amount{flex:0 1 100px;min-width:70px;padding:5px 6px;border:1px solid var(--line);border-radius:var(--radius-sm);text-align:right;}
  .practice-head{display:flex;align-items:center;gap:8px;}
  .practice-head .unsaved-dot{margin-left:0;}
  .practice-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;}
  .practice-warn:empty{display:none;}
  .warn{color:#c9750c;font-size:11px;}

  .summary{background:var(--card-white);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px;overflow-x:auto;}
  .summary h2{font-size:16px;margin:0 0 10px;}
  table{border-collapse:collapse;width:100%;font-size:13px;}
  table th, table td{border:1px solid var(--line);padding:6px 8px;text-align:right;}
  table th{background:var(--bg);white-space:nowrap;}
  table td.label, table th.label{text-align:left;}
  .grand-row td{font-weight:bold;background:#eef2ff;}
  .method-tag{padding:2px 8px;border-radius:var(--radius-pill);font-size:11px;}
  .method-tag.cash{background:var(--cash-bg);color:#3d6b1a;}
  .method-tag.card{background:var(--card-bg);color:#a02050;}
  .method-tag.transfer{background:var(--transfer-bg);color:#8a6300;}

  .view-toggle{display:flex;flex-wrap:nowrap;align-items:center;gap:14px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;}
  .nav-links{display:flex;flex-wrap:nowrap;gap:6px;flex-shrink:0;}
  .nav-status{display:flex;flex-wrap:nowrap;gap:8px;align-items:center;flex-shrink:0;margin-left:auto;}
  .nav-links .btn, .nav-status .btn, .nav-status .autosave-badge, .nav-status .method-tag{flex-shrink:0;}
  .login-box{flex-direction:column;align-items:stretch;gap:12px;max-width:360px;margin:60px auto;}
  .login-box label{display:block;margin-bottom:4px;font-size:13px;color:var(--ink-muted);}
  .login-box input{width:100%;padding:8px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:14px;}
  .staff-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;}
  .locked-area{opacity:0.55;pointer-events:none;}
  .lock-banner{background:#fff3cd;border:1px solid #ffe58a;color:#7a5b00;padding:8px 12px;border-radius:var(--radius-lg);margin-bottom:12px;font-size:13px;}
  .lock-banner.admin-mode{background:#e6f4ff;border-color:#a9d4ff;color:#0b4a8f;}
  .save-error-banner{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:#fdeceb;border:1px solid var(--danger);color:#8a2018;
    padding:10px 12px;border-radius:var(--radius-lg);margin-bottom:12px;font-size:13px;line-height:1.5;
  }
  .save-error-banner span{flex:1 1 220px;}
  .save-error-banner .btn{flex:0 0 auto;border-color:var(--danger);color:var(--danger);font-weight:600;}

  .board-card{background:var(--card-white);border:1px solid var(--line);border-radius:var(--radius-lg);margin-bottom:14px;overflow:hidden;}
  .board-card .date-row{background:transparent;border:none;border-radius:0;margin-bottom:0;border-bottom:1px solid var(--line);}
  .board-card .board-wrap{border:none;border-radius:0;margin-bottom:0;}
  .board-wrap{overflow-x:auto;background:var(--card-white);border:1px solid var(--line);border-radius:var(--radius-lg);padding:12px;margin-bottom:14px;}
  /* table-layout:fixed keeps every 30-min column exactly equal and stops the
     room column from swallowing all the spare width (it used to stretch to
     ~566px at 1600px while the slots stayed 32px). The board keeps its
     natural width here — stretching to fill is desktop-only, see the
     min-width:601px block. --board-min is set inline from the slot count. */
  .board-table{border-collapse:collapse;font-size:11px;user-select:none;table-layout:fixed;width:var(--board-min);}
  .board-table th, .board-table td{border:1px solid var(--line);padding:0;text-align:center;white-space:nowrap;}
  .board-table th{background:var(--bg);padding:4px 3px;font-size:10px;font-weight:normal;color:var(--ink-muted);}
  .board-room-col{position:sticky;left:0;background:var(--bg);z-index:2;width:56px;padding:4px 10px !important;text-align:left;font-weight:bold;font-size:12px;}
  .board-cell{height:38px;cursor:pointer;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px;}
  .board-cell.free{background:#fff;}
  .board-cell.free:hover{background:#eef7e3;}
  .board-cell.free.selecting{background:var(--accent) !important;opacity:0.5;}
  /* While a touch selection is active, suppress scrolling and the iOS
     text-selection / callout gestures that would otherwise fight the drag. */
  body.board-dragging{user-select:none;-webkit-user-select:none;}
  body.board-dragging .board-wrap{touch-action:none;-webkit-touch-callout:none;}
  body.board-dragging .board-table{outline:2px solid var(--accent);outline-offset:-2px;}
  .board-cell.occupied{color:#7a2050;font-weight:bold;}
  .board-cell.occupied:hover{filter:brightness(0.93);}
  .board-legend{font-size:11px;color:var(--ink-muted);margin-top:8px;}
  .board-hint{display:inline-block;margin-left:4px;}
  .board-cell-demo{display:inline-block;width:12px;height:12px;border:1px solid var(--line);vertical-align:middle;margin:0 4px 0 10px;}
  .board-cell-demo:first-child{margin-left:0;}
  .board-cell-demo.free{background:#fff;}
  .board-cell-demo.occupied{background:var(--card-bg);}

  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:1000;}
  .modal-box{background:#fff;border-radius:var(--radius-lg);padding:20px;width:min(300px, 92vw);display:flex;flex-direction:column;gap:6px;}
  .modal-box label{font-size:13px;color:var(--ink-muted);margin-top:8px;}
  .modal-box input, .modal-box select{padding:7px 8px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:14px;}
  .list-table-wrap{background:var(--card-white);border:1px solid var(--line);border-radius:var(--radius-lg);padding:14px;margin-bottom:14px;overflow-x:auto;}
  select.month-select{padding:6px 8px;border:1px solid var(--line);border-radius:var(--radius-sm);}
  .row-actions{display:flex;gap:4px;}
  .audit-pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px;font-size:12px;color:var(--ink-muted);}
  footer{text-align:center;color:var(--ink-muted);font-size:11px;margin-top:20px;}

  @media (max-width: 480px){
    :root{--body-pad:10px;}
    h1{font-size:17px;}
    .btn{padding:6px 10px;font-size:12.5px;}
    table{font-size:12px;}
    table th, table td{padding:5px 6px;}
  }

  .lbl-short{display:none;}

  .app-header{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .app-header h1{margin:0;}
  .hamburger-btn{display:none;}
  .mobile-drawer-backdrop{display:none;}
  .mobile-drawer{
    display:none;flex-direction:column;justify-content:space-between;
    position:fixed;top:0;right:0;bottom:0;width:min(260px, 78vw);
    background:var(--card-white);z-index:900;padding:16px;
    transform:translateX(100%);transition:transform .25s ease;
    box-shadow:-2px 0 12px rgba(0,0,0,0.12);
  }
  .mobile-drawer-links{display:flex;flex-direction:column;gap:6px;}
  .drawer-link{
    padding:12px 14px;border-radius:var(--radius-sm);border:1px solid transparent;
    background:transparent;color:var(--ink);font-size:15px;font-weight:600;text-align:left;cursor:pointer;
  }
  .drawer-link.active{background:var(--accent);color:#fff;}
  .mobile-drawer-footer{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:14px;}
  .mobile-only-close{display:none;}

  /* Unified layout: the drawer/hamburger nav and compact date-row/tabs
     that used to be mobile-only (<=600px) now apply at every width. */
  .lbl-full{display:none;}
  .lbl-short{display:inline;}
  .view-toggle{display:none;}

  #header{position:fixed;top:0;left:0;right:0;z-index:600;background:#fff;padding:0 var(--body-pad);}
  body{padding-top:66px;}
  .app-header{padding:10px 0;position:relative;justify-content:flex-end;}
  .app-header h1{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:20px;white-space:nowrap;}
  .hamburger-btn{
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    width:40px;height:40px;border:none;background:transparent;
    font-size:24px;line-height:1;color:var(--ink);cursor:pointer;
  }
  .hamburger-btn.active{color:var(--accent);}
  .mobile-drawer-backdrop.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:899;}
  .mobile-drawer{display:flex;}
  .mobile-drawer.open{transform:translateX(0);}

  .date-row{flex-wrap:nowrap;overflow-x:auto;padding:9px 12px;margin-bottom:8px;}
  .date-row > *{flex-shrink:0;}
  .date-row input[type=date], .date-row .weekday, .date-row .btn, .date-row .method-tag{
    height:32px;box-sizing:border-box;display:inline-flex;align-items:center;
  }
  .date-row .mobile-only-close{display:inline-flex;}

  .tabs{flex-wrap:nowrap;overflow-x:visible;gap:0;}
  .tab{flex:1 1 0;text-align:center;padding:9px 2px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* Desktop only: wide screens have room to put the whole reservation
     row and the whole payment row on one line each, so the time
     selects shrink back down and the payment row drops the 2-line grid. */
  @media (min-width: 601px){
    .visit-head select{flex:0 0 90px;min-width:0;}
    .visit-head input.customer, .visit-head input.phone{flex:1 1 160px;min-width:0;}

    .pay-row{display:flex;flex-wrap:nowrap;align-items:center;gap:8px;}
    .pay-row select{flex:0 0 130px;min-width:0;}
    .pay-row .method-btns{flex:0 0 auto;}
    .pay-row .amount-wrap{flex:0 0 130px;}
    .pay-row input.memo{flex:1 1 auto;min-width:0;}
    .pay-row .x{flex:0 0 auto;}

    /* Only a real monitor gets the stretched board — on a phone the slots
       stay at their natural size and the wrapper scrolls instead. */
    .board-table{width:100%;min-width:var(--board-min);}
  }

  /* iOS Safari zooms the whole page in whenever a focused field's text is
     smaller than 16px, and every control here was 12–14px. Raising them to
     16px on touch devices is the only fix that doesn't disable pinch-zoom
     (maximum-scale / user-scalable=no would, and that's an accessibility
     regression). Listed per selector so each beats the earlier rule it
     overrides; desktop keeps the smaller, denser text. */
  @media (pointer: coarse), (max-width: 600px){
    .topbar input[type=date], .topbar input[type=text],
    .visit-head select, .visit-head input[type=text], .visit-head input[type=tel],
    .pay-row select, .pay-row input,
    .birdie-stepper input,
    .practice-row input.amount,
    .modal-box input, .modal-box select,
    .login-box input,
    select.month-select{
      font-size:16px;
    }
    /* 16px text needs a taller box than these were built for. */
    .visit-head select, .visit-head input[type=text], .visit-head input[type=tel],
    .pay-row select, .pay-row input{height:34px;}
    .birdie-stepper input{height:28px;width:44px;}
    .birdie-stepper button{width:28px;font-size:16px;}
    .practice-row input.amount{padding:6px;}
    /* At 16px the full label no longer fits on the 예약 시간 line, which broke
       the row into three. The board linkage is explained in 메뉴얼 anyway. */
    .lbl-board-link{display:none;}
    /* Widen the paired column so the longest 항목 종류 still reads, keeping the
       name field and the pay-type select on the same right edge. */
    .pay-row{grid-template-columns:150px 1fr;}
    .visit-head input.customer{flex:0 0 150px;}
    .pay-row .amount-wrap{grid-column:1;}
  }
</style>
</head>
<body>
<div id="header"></div>
<div id="app"></div>
<footer>모든 데이터는 클라우드(Firestore)에 저장되어 어느 기기에서 접속해도 동일하게 보입니다. 예약 카드의 수정 내용은 카드 안의 "💾 저장" 버튼을 눌러야 반영됩니다.</footer>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
const FIREBASE_CONFIG = {
  projectId: "screen-golf-manager",
  appId: "1:94940029914:web:698ed0da783773838596e3",
  storageBucket: "screen-golf-manager.firebasestorage.app",
  apiKey: "AIzaSyA5MhepW5yZ_hLD16POQsnXB_7j4zgDFAM",
  authDomain: "screen-golf-manager.firebaseapp.com",
  messagingSenderId: "94940029914",
};
let db; // set in init() after firebase.initializeApp()

const ROOMS = ['R1','R2','R3','R5','R6','R7','R8','R9'];

const BOARD_SLOTS = (()=>{
  const slots = [];
  for(let h=9; h<24; h++){
    slots.push(`${String(h).padStart(2,'0')}:00`);
    slots.push(`${String(h).padStart(2,'0')}:30`);
  }
  return slots;
})();

const BOARD_MIN_WIDTH = BOARD_ROOM_COL_PX + BOARD_SLOTS.length * BOARD_MIN_SLOT_PX;
function slotEnd(slot){
  const [h,m] = slot.split(':').map(Number);
  let nh=h, nm=m+30;
  if(nm>=60){ nh+=1; nm=0; }
  return `${String(nh).padStart(2,'0')}:${String(nm).padStart(2,'0')}`;
}
function endTimeOptions(start){
  const opts = [];
  let cur = slotEnd(start);
  while(true){
    opts.push(cur);
    if(cur === '24:00') break;
    cur = slotEnd(cur);
  }
  return opts;
}

function blankLog(date){
  return {
    date, staff:'',
    rooms: Object.fromEntries(ROOMS.map(r=>[r,[]])),
    practice: [],
  };
}
// Shared by the single-date load path and the list-view batch prefetch.
function normalizeLog(parsed){
  ROOMS.forEach(r=>{
    if(!parsed.rooms[r]) parsed.rooms[r]=[];
    // Visits saved before "작성자 기록" existed have no createdBy — best-guess
    // it as whoever this date's 담당자 was at the time, so cross-staff edits
    // on old data can still be detected instead of silently going unlogged.
    parsed.rooms[r].forEach(v=>{ if(!v.createdBy) v.createdBy = parsed.staff || ''; });
  });
  if(!parsed.practice) parsed.practice=[];
  return parsed;
}
// Deliberately does NOT catch read errors here — a transient network failure
// must never be silently treated as "this date has no data", because that
// blank stand-in would then get written back over the real document by the
// next save. Callers must catch and keep whatever was already on screen.
async function loadLog(date){
  const snap = await db.collection('logs').doc(date).get();
  return snap.exists ? normalizeLog(snap.data()) : blankLog(date);
}
function deepCopy(o){ return JSON.parse(JSON.stringify(o)); }
// The server state this session last synced from / wrote to. Used as the
// common ancestor for the 3-way merge in commitLog() so a save can tell
// "this visit was deleted by me" apart from "this visit was added by
// someone else after I loaded".
let baseLog = null;
function setBase(log){ baseLog = deepCopy(log); }

// ---- 3-way merge (server vs. our draft vs. the state we last synced) ----
// Granularity matters: an earlier version merged whole visits, so a visit
// both sides knew about was taken from our draft wholesale — silently
// erasing a 결제 another device had added inside it. Everything below merges
// down to individual fields and individual payment rows.
const same = (a,b) => JSON.stringify(a) === JSON.stringify(b);
// Per-field: a field we actually changed keeps our value; a field we left
// alone takes the server's (so remote edits survive). Works for deletions
// too — an absent key is just `undefined` on either side.
function mergeFields(server, local, base, skipKeys){
  const out = {};
  const keys = new Set([...Object.keys(server||{}), ...Object.keys(local||{})]);
  keys.forEach(k=>{
    if(skipKeys && skipKeys.has(k)) return;
    const s = server ? server[k] : undefined;
    const l = local ? local[k] : undefined;
    const b = base ? base[k] : undefined;
    if(!same(l, b)){ if(l !== undefined) out[k] = l; }   // we changed it (or removed it)
    else if(s !== undefined) out[k] = s;                  // untouched by us -> server wins
  });
  return out;
}
// Per-row for id-keyed arrays (visits, payments, practice rows).
function mergeById(serverList, localList, baseList, mergeItem){
  serverList = serverList || []; localList = localList || []; baseList = baseList || [];
  const sById = new Map(serverList.map(x=>[x.id, x]));
  const bById = new Map(baseList.map(x=>[x.id, x]));
  const lById = new Map(localList.map(x=>[x.id, x]));
  const out = localList.map(lx => mergeItem(sById.get(lx.id), lx, bById.get(lx.id)));
  serverList.forEach(sx=>{
    // Unknown to both our draft and our sync base => created elsewhere after
    // we loaded. Keep it. (Present in base but not local = we deleted it.)
    if(!lById.has(sx.id) && !bById.has(sx.id)) out.push(sx);
  });
  return out;
}
const mergeRow = (s,l,b) => mergeFields(s,l,b);
function mergeVisit(s, l, b){
  const v = mergeFields(s, l, b, new Set(['payments']));
  v.payments = mergeById(s && s.payments, l && l.payments, b && b.payments, mergeRow);
  return v;
}
function mergeForSave(serverLog, localLog, base){
  if(!serverLog) return deepCopy(localLog);
  const merged = mergeFields(serverLog, localLog, base, new Set(['rooms','practice']));
  merged.rooms = {};
  ROOMS.forEach(r=>{
    merged.rooms[r] = mergeById(
      (serverLog.rooms||{})[r], (localLog.rooms||{})[r], ((base&&base.rooms)||{})[r], mergeVisit);
  });
  merged.practice = mergeById(
    serverLog.practice, localLog.practice, base && base.practice, mergeRow);
  return merged;
}
// Single commit path for every write. Runs in a transaction so the merge
// sees the document as it is at write time, not a stale cached copy.
async function commitLog(){
  const date = state.log.date;
  const ref = db.collection('logs').doc(date);
  try{
    const merged = await db.runTransaction(async tx=>{
      const snap = await tx.get(ref);
      const m = mergeForSave(snap.exists ? snap.data() : null, state.log, baseLog);
      tx.set(ref, m);
      return m;
    });
    if(state.log.date === date) state.log = normalizeLog(merged);
    setBase(merged);
    markSaved();
    return true;
  }catch(err){
    console.warn('일지 저장 실패:', err);
    markSaveFailed();
    return false;
  }
}
let logUnsubscribe = null;
// Latest server state we received but could not safely apply yet (user was
// mid-edit, on another view, or holding an unsaved draft). Buffering it is
// the whole point: the previous version simply dropped such updates, and
// since onSnapshot only re-fires when the document CHANGES again, state.log
// stayed stale indefinitely — then the next save pushed that stale copy over
// the server. That stale-overwrite loop is what made saved info flicker in
// and then vanish.
let pendingRemoteLog = null;
function applyPendingRemote(){
  if(!pendingRemoteLog) return;
  if(state.currentDate !== pendingRemoteLog.date){ pendingRemoteLog = null; return; }
  if(hasUnsavedChanges()) return;                     // keep the user's unsaved draft
  const active = document.activeElement;
  if(active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA')) return; // would break IME composition
  const incoming = pendingRemoteLog;
  pendingRemoteLog = null;
  state.log = incoming;
  setBase(incoming);
  if(state.view === 'edit') render();
}
function subscribeLog(date){
  if(logUnsubscribe){ logUnsubscribe(); logUnsubscribe = null; }
  pendingRemoteLog = null;
  logUnsubscribe = db.collection('logs').doc(date).onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites) return; // our own write echoing back; state.log already has it
    if(state.currentDate !== date) return;     // listener outlived the date it was opened for
    pendingRemoteLog = snap.exists ? normalizeLog(snap.data()) : blankLog(date);
    applyPendingRemote();
  }, err=>{ console.warn('실시간 동기화 실패:', err); });
}
// Once the user leaves a field, any update we deferred above becomes safe.
document.addEventListener('focusout', ()=>setTimeout(applyPendingRemote, 0));
function deleteLogDate(date){
  return db.collection('logs').doc(date).delete();
}

// ---------- admin auth ----------
async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
const ADMIN_DOC = () => db.collection('config').doc('admin');
async function getAdminHash(){
  const snap = await ADMIN_DOC().get();
  return snap.exists ? snap.data().hash : null;
}
function setAdminHash(hash){
  return ADMIN_DOC().set({ hash });
}
async function ensureAdminHash(){
  if(!(await getAdminHash())){
    await setAdminHash(await sha256(DEFAULT_ADMIN_PASSWORD));
  }
}
async function attemptLogin(id, pw){
  id = (id||'').trim();
  if(!id || !pw){ alert('아이디와 비밀번호를 입력하세요.'); return; }
  if(id === 'admin'){
    const hash = await sha256(pw);
    if(hash === await getAdminHash()){
      session = { role:'admin', name:'admin' };
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
      state.view = 'edit';
      render();
    } else {
      alert('관리자 비밀번호가 올바르지 않습니다.');
    }
    return;
  }
  const staffAcct = (await getStaffList()).find(s=>s.name===id);
  if(!staffAcct){
    alert('등록되지 않은 이름입니다. 관리자에게 계정 등록을 요청하세요.');
    return;
  }
  const hash = await sha256(pw);
  if(hash !== staffAcct.passwordHash){
    alert('비밀번호가 올바르지 않습니다.');
    return;
  }
  session = { role:'staff', name: staffAcct.name };
  sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
  state.view = 'edit';
  render();
}
function logout(){
  session = null;
  sessionStorage.removeItem(SESSION_KEY);
  state.view = 'edit';
  render();
}
async function changeAdminPassword(){
  const oldPw = prompt('현재 비밀번호를 입력하세요');
  if(oldPw===null) return;
  const hash = await sha256(oldPw);
  if(hash !== await getAdminHash()){ alert('현재 비밀번호가 올바르지 않습니다.'); return; }
  const newPw = prompt('새 비밀번호를 입력하세요');
  if(newPw===null || newPw.trim()==='') return;
  const confirmPw = prompt('새 비밀번호를 한 번 더 입력하세요');
  if(confirmPw !== newPw){ alert('입력한 두 비밀번호가 서로 다릅니다. 다시 시도해주세요.'); return; }
  await setAdminHash(await sha256(newPw));
  alert('비밀번호가 변경되었습니다.');
  render();
}

// ---------- audit log ----------
// Records who performed the action alongside it, so the 변경 이력 table can
// show it as its own column rather than baking the name into the text.
function auditActor(){
  return session ? (session.name + (isAdmin() ? ' (관리자)' : '')) : '(미상)';
}
function addAudit(date, type, detail){
  db.collection('audit').add({ ts: new Date().toISOString(), date, type, detail, who: auditActor() })
    .catch(err=>console.warn('감사 로그 기록 실패:', err));
}
// 변경 이력은 1개월치만 보관한다. 기준 시각(그보다 오래된 기록은 삭제 대상).
// A flat 31 days rather than setMonth(-1): on e.g. 3월 31일 that would
// overflow "2월 31일" into 3월 3일 and delete entries only ~28 days old.
// Deletion is irreversible, so round in favour of keeping.
const AUDIT_RETENTION_DAYS = 31;
function auditCutoffIso(){
  return new Date(Date.now() - AUDIT_RETENTION_DAYS * 24 * 60 * 60 * 1000).toISOString();
}
// Deletes entries older than the retention window. Runs when an admin opens
// the page — the only time anyone reads this collection — so retention costs
// nothing during normal register use. Failure is non-fatal: the table still
// filters by the cutoff, so stale rows are never shown even if a delete
// didn't go through (e.g. offline).
async function pruneOldAudit(){
  try{
    const cutoff = auditCutoffIso();
    const old = await db.collection('audit').where('ts','<',cutoff).limit(400).get();
    if(old.empty) return 0;
    // Firestore caps a batch at 500 writes.
    let batch = db.batch(), n = 0;
    for(const doc of old.docs){
      batch.delete(doc.ref);
      if(++n % 400 === 0){ await batch.commit(); batch = db.batch(); }
    }
    if(n % 400 !== 0) await batch.commit();
    return n;
  }catch(err){
    console.warn('오래된 변경 이력 정리 실패:', err);
    return 0;
  }
}
// Bounded read, and never returns anything past the retention window.
async function getAudit(){
  const cutoff = auditCutoffIso();
  const snap = await db.collection('audit').orderBy('ts','desc').limit(400).get();
  return snap.docs.map(d=>d.data()).filter(a=>a.ts && a.ts >= cutoff);
}
// Describes a visit for the audit detail text, e.g. 'R1 홍길동'.
function visitLabel(room, v){
  return `${ROOM_LABEL[room]||room} ${(v && v.customer) || '이름없음'}`;
}

// ---------- day close / lock ----------
function isLocked(){
  return !!(state.log && state.log.closed) && !isAdmin();
}
// Blocks the edit if locked (alerts + reverts UI). Also logs an audit trail
// entry when an admin edits an already-closed day, so a later admin review
// can see that a closed day's figures were touched after close.
function guardEdit(){
  if(state.log.closed && !isAdmin()){
    alert('마감된 일지입니다. 관리자만 수정할 수 있습니다.');
    render();
    return false;
  }
  return true;
}
// Lighter guard for quiet (per-keystroke) text fields.
function isBlockedForEdit(){
  if(state.log.closed && !isAdmin()){
    alert('마감된 일지입니다. 관리자만 수정할 수 있습니다.');
    render();
    return true;
  }
  return false;
}
function closeDay(){
  if(state.log.closed) return;
  const closer = session ? session.name : ((state.log.staff||'').trim() || '(담당자 미기재)');
  if(!confirm(`${state.log.date} 일지를 마감할까요?\n마감 후에는 관리자만 수정할 수 있습니다.`)) return;
  state.log.closed = true;
  state.log.closedAt = new Date().toISOString();
  state.log.closedBy = closer;
  persistAndRender();
}
function reopenDay(){
  if(!isAdmin() || !state.log.closed) return;
  if(!confirm(`${state.log.date} 일지의 마감을 취소하고 다시 직원이 수정할 수 있게 할까요?`)) return;
  state.log.closed = false;
  delete state.log.closedAt;
  delete state.log.closedBy;
  persistAndRender();
}

let state = {
  view: 'edit', // 'edit' | 'list' | 'admin' | 'manual'
  currentDate: todayStr(),
  log: null, // populated async by init()
  activeRoom: 'R1',
  listMonth: null,
  listData: null, // { dates, logsByDate } — prefetched when entering list view
  adminData: null, // { staffList, audit } — prefetched when entering admin view
  auditPage: 0,    // 0-based page index into adminData.audit (AUDIT_PAGE_SIZE per page)
};
// Bumped at the start of every async view/date load below; a load only
// applies its result if this counter hasn't moved on since it started. This
// stops a slow, older request from resolving after a newer one and snapping
// the screen (and Firestore, via the next save) back to stale data — the
// root cause behind settings occasionally "reverting" when switching dates
// or views quickly (e.g. typing into the date field fires multiple change
// events before you've finished).
let loadGeneration = 0;
let collapsedVisits = new Set(); // UI-only: which visit cards are folded (not persisted)
let bookingDialog = null; // { room, start } while the board's "new booking" modal is open

let lastSavedAt = null;
// Save state is rendered from here, never poked into the DOM directly: a
// DOM-only warning was wiped by the very next render() and, worse, lived in
// an element that had ended up display:none at every width — so a failed
// save showed the user nothing at all.
let lastSaveFailed = false;
function markSaved(){
  lastSavedAt = new Date();
  lastSaveFailed = false;
}
function markSaveFailed(){
  lastSaveFailed = true;
}
// Shown at the top of the editor while the last write is known to have
// failed, so work that only exists on screen can't be mistaken for saved.
function renderSaveErrorBanner(){
  if(!lastSaveFailed) return '';
  return `
    <div class="save-error-banner">
      <span>⚠ 저장하지 못했습니다. 화면의 내용이 아직 서버에 반영되지 않았습니다 — 인터넷 연결을 확인한 뒤 다시 저장해주세요.</span>
      <button class="btn small" onpointerdown="event.preventDefault();retryFailedSave()">다시 저장</button>
    </div>
  `;
}
async function retryFailedSave(){
  if(!state.log) return;
  const ok = await commitLog();
  render();
  if(ok) flashSavedConfirmation();
  else alert('아직 저장되지 않았습니다. 인터넷 연결을 확인해주세요.');
}
// Whoever is logged in as staff and actually edits a day's log becomes its
// recorded 담당자 — this replaces manually typing a name.
function syncStaffOwnership(){
  if(session && session.role==='staff' && state.log.staff !== session.name){
    state.log.staff = session.name;
  }
}
// Structural changes (adding/removing a visit, creating a booking, 연습장
// 매출, 마감) commit straight away: they're already deliberate, confirmed
// actions, and saving them immediately means a room can never end up with
// pending edits but no visit card left to host a 저장 button.
async function persistAndRender(){
  syncStaffOwnership();
  render();              // show the change immediately, don't wait on the round-trip
  const ok = await commitLog();
  render();              // re-render on the merged result the server actually holds
  // These paths have no 저장 button to report through, so a failure here used
  // to be completely silent: the card appeared on screen while nothing had
  // reached the server. Say so plainly.
  if(!ok) alert('저장하지 못했습니다. 화면에는 반영됐지만 서버에는 저장되지 않았습니다.\n인터넷 연결을 확인한 뒤 상단의 "다시 저장"을 눌러주세요.');
}
// Which visits hold edits that haven't been committed yet. Per-visit rather
// than one global flag so each room card's 저장 button can show whether that
// particular card has something to save. 연습장 매출 rows are tracked the same
// way in their own set, so that section behaves identically.
const dirtyVisits = new Set();
const dirtyPractice = new Set();
function hasUnsavedChanges(){ return dirtyVisits.size > 0 || dirtyPractice.size > 0; }
function clearDirty(){ dirtyVisits.clear(); dirtyPractice.clear(); }
function markDirty(visitId){
  if(visitId) dirtyVisits.add(visitId);
  render();
}
// Same as markDirty but skips the full render — used by free-text fields
// (Korean/IME input) where re-rendering per keystroke would destroy the
// input node and break IME composition. Touches only the few nodes that
// need to change, never innerHTML, so nothing under the user's finger is
// swapped out mid-interaction.
function markDirtyQuiet(visitId){
  if(visitId) dirtyVisits.add(visitId);
  const card = document.getElementById('visit-' + visitId);
  const btn = document.getElementById('saveBtn-' + visitId);
  if(btn){ btn.disabled = false; btn.classList.add('primary'); btn.textContent = '💾 저장'; }
  if(card && !card.querySelector('.unsaved-dot')){
    const bar = card.querySelector('.visit-summary-bar');
    if(bar){
      const dot = document.createElement('span');
      dot.className = 'unsaved-dot';
      dot.textContent = '● 미저장';
      bar.appendChild(dot);
    }
  }
}
// Reflects a customer-name edit in the card's summary line without a full
// re-render (that used to be an onblur="render()", which destroyed the DOM
// the user was about to click — see saveLogChanges).
function refreshVisitSummaryName(visitId, name){
  const el = document.querySelector('#visit-' + visitId + ' .visit-summary-bar b');
  if(el) el.textContent = name || '(이름 미입력)';
}
async function saveLogChanges(){
  // Runs on pointerdown, i.e. BEFORE the focused field blurs, so first flush
  // whatever the user was still typing into state.log. Without this the
  // in-progress value would be lost; and binding on click instead would mean
  // never running at all when a blur/change handler re-renders the button
  // out from under the pointer (mousedown and mouseup then land on different
  // nodes, so no click event is ever produced).
  const a = document.activeElement;
  if(a && a !== document.body && typeof a.blur === 'function') a.blur();
  if(!state.log || !hasUnsavedChanges()) return;
  syncStaffOwnership();
  // Capture what is being saved before commitLog() replaces state.log with
  // the merged result and the dirty sets are cleared.
  const saved = [];
  dirtyVisits.forEach(id=>{
    for(const r of ROOMS){
      const v = (state.log.rooms[r]||[]).find(x=>x.id===id);
      if(v){ saved.push(visitLabel(r, v)); break; }
    }
  });
  if(dirtyPractice.size) saved.push(`연습장 매출 ${dirtyPractice.size}건`);
  const ok = await commitLog();
  if(!ok){
    alert('저장하지 못했습니다. 인터넷 연결을 확인한 뒤 다시 저장해주세요.');
    return; // keep the draft (and its dirty markers) so the user can retry
  }
  addAudit(state.log.date, 'SAVE', saved.length ? saved.join(', ') : '예약 카드');
  clearDirty();
  applyPendingRemote(); // pull in anything that arrived while we were dirty
  render();
  flashSavedConfirmation();
}
// Explicit visible proof the write actually happened — a silently swallowed
// save is precisely what let earlier data loss go unnoticed.
function flashSavedConfirmation(){
  document.querySelectorAll('[id^="saveBtn-"]').forEach(btn=>{
    btn.textContent = '✔ 저장됨';
    btn.classList.add('saved-flash');
  });
  setTimeout(()=>{
    document.querySelectorAll('.saved-flash').forEach(btn=>{
      btn.textContent = '💾 저장';
      btn.classList.remove('saved-flash');
    });
  }, 1500);
}
// Guards any navigation away from the currently-open log (date change,
// leaving to a different date via the list view, closing the tab) so an
// unsaved draft is never silently discarded.
function confirmDiscardIfDirty(){
  if(!hasUnsavedChanges()) return true;
  return confirm('저장하지 않은 변경사항이 있습니다. 저장하지 않고 이동하면 변경사항이 사라집니다. 계속할까요?');
}
window.addEventListener('beforeunload', e=>{
  if(hasUnsavedChanges()){ e.preventDefault(); e.returnValue = ''; }
});
// Retry-on-failure safety net only — never a blind periodic re-save, which
// is how a tab left open on a stale copy used to stomp other devices' work.
// Also flushes any remote update we had to defer, so one can't sit unapplied
// indefinitely if the user leaves focus parked in a field.
setInterval(()=>{
  if(state.log && lastSaveFailed) commitLog();
  applyPendingRemote();
}, 60000);
// Coming back to the tab (phone unlocked, app re-focused) is a natural point
// to pick up whatever changed while it was in the background.
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) applyPendingRemote(); });

// ---------- mutation helpers ----------
// (all mutations respect isLocked()/guardEdit() — see "day close / lock" section above)
async function changeDate(v){
  if(!confirmDiscardIfDirty()){ render(); return; } // render() resets the <input type=date> back to state.currentDate
  clearDirty();
  const myGen = ++loadGeneration;
  const prevDate = state.currentDate, prevLog = state.log;
  state.currentDate = v;
  state.log = null;
  render();
  try{
    const log = await loadLog(v);
    if(myGen !== loadGeneration) return; // superseded by a newer date/view change — don't clobber it
    state.log = log;
    setBase(log);
    subscribeLog(v);
  }catch(e){
    if(myGen !== loadGeneration) return;
    alert('일지를 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 시도해주세요.');
    state.currentDate = prevDate;
    state.log = prevLog; // never leave the screen on a blank stand-in that could get saved over the real data
  }
  render();
}

// ---------- board (occupancy grid) ----------
// Drag-to-select: mousedown on a free cell starts tracking; mouseenter over
// subsequent free cells in the same room row extends the selection (entering
// an occupied cell or a different room simply stops extending, it doesn't
// error); mouseup anywhere finalizes and opens the booking dialog with the
// dragged range pre-filled. A plain click (no real drag) behaves exactly as
// before — startSlot===endSlot, so openBookingDialog falls back to its
// default ~1 hour suggestion.
let boardDrag = null; // { room, startSlot, endSlot } while dragging on the board
function startBoardDrag(room, slot){
  boardDrag = { room, startSlot: slot, endSlot: slot };
  highlightBoardDrag();
}
function extendBoardDrag(room, slot){
  if(!boardDrag || boardDrag.room !== room) return;
  boardDrag.endSlot = slot;
  highlightBoardDrag();
}

// ----- touch drag -----
// A finger can't hover, so mouseenter never fires and the mouse path above
// does nothing on a phone. It also can't just mirror mousedown: the board
// scrolls horizontally and the page scrolls vertically, so grabbing on
// touchstart would break both. Resolution: press and hold briefly to enter
// selection mode (the same gesture used for drag-select elsewhere on mobile),
// then the finger paints a range. A short tap is untouched and still opens
// the booking dialog for that single slot.
const BOARD_TOUCH_HOLD_MS = 350;
const BOARD_TOUCH_MOVE_TOLERANCE = 12; // px of slop allowed before it counts as a scroll
let boardTouchHoldTimer = null;
let boardTouchOrigin = null;   // { x, y, room, slot } between touchstart and hold
let boardTouchDragging = false;
function cancelBoardTouchHold(){
  clearTimeout(boardTouchHoldTimer);
  boardTouchHoldTimer = null;
  boardTouchOrigin = null;
}
function boardFreeCellAt(x, y){
  const el = document.elementFromPoint(x, y);
  if(!el || !el.classList) return null;
  const cell = el.closest ? el.closest('.board-cell') : null;
  return (cell && cell.classList.contains('free')) ? cell : null;
}
function onBoardTouchStart(e){
  if(e.touches.length !== 1) return;          // pinch/zoom is not ours
  const t = e.touches[0];
  const cell = boardFreeCellAt(t.clientX, t.clientY);
  if(!cell) return;
  boardTouchOrigin = { x:t.clientX, y:t.clientY, room:cell.dataset.room, slot:cell.dataset.slot };
  boardTouchHoldTimer = setTimeout(()=>{
    if(!boardTouchOrigin) return;
    boardTouchDragging = true;
    document.body.classList.add('board-dragging');
    startBoardDrag(boardTouchOrigin.room, boardTouchOrigin.slot);
  }, BOARD_TOUCH_HOLD_MS);
}
function onBoardTouchMove(e){
  if(boardTouchDragging){
    // Non-passive listener: this is what keeps the page/board from scrolling
    // out from under an active selection.
    e.preventDefault();
    const t = e.touches[0];
    const cell = boardFreeCellAt(t.clientX, t.clientY);
    if(cell) extendBoardDrag(cell.dataset.room, cell.dataset.slot);
    return;
  }
  // Moved before the hold completed => the user meant to scroll.
  if(boardTouchOrigin){
    const t = e.touches[0];
    if(Math.abs(t.clientX-boardTouchOrigin.x) > BOARD_TOUCH_MOVE_TOLERANCE ||
       Math.abs(t.clientY-boardTouchOrigin.y) > BOARD_TOUCH_MOVE_TOLERANCE) cancelBoardTouchHold();
  }
}
function onBoardTouchEnd(e){
  cancelBoardTouchHold();
  if(!boardTouchDragging) return;             // a plain tap: the emulated click opens the dialog
  boardTouchDragging = false;
  document.body.classList.remove('board-dragging');
  // Suppress the emulated mousedown/mouseup this touch would otherwise
  // produce — they'd restart the drag and reopen the dialog on one slot.
  if(e && e.cancelable) e.preventDefault();
  finishBoardDrag();
}
function highlightBoardDrag(){
  document.querySelectorAll('.board-cell.selecting').forEach(el=>el.classList.remove('selecting'));
  if(!boardDrag) return;
  const lo = Math.min(BOARD_SLOTS.indexOf(boardDrag.startSlot), BOARD_SLOTS.indexOf(boardDrag.endSlot));
  const hi = Math.max(BOARD_SLOTS.indexOf(boardDrag.startSlot), BOARD_SLOTS.indexOf(boardDrag.endSlot));
  for(let i=lo;i<=hi;i++){
    const el = document.querySelector(`.board-cell[data-room="${boardDrag.room}"][data-slot="${BOARD_SLOTS[i]}"]`);
    if(el) el.classList.add('selecting');
  }
}
function finishBoardDrag(){
  if(!boardDrag) return;
  const { room, startSlot, endSlot } = boardDrag;
  document.querySelectorAll('.board-cell.selecting').forEach(el=>el.classList.remove('selecting'));
  boardDrag = null;
  const lo = Math.min(BOARD_SLOTS.indexOf(startSlot), BOARD_SLOTS.indexOf(endSlot));
  const hi = Math.max(BOARD_SLOTS.indexOf(startSlot), BOARD_SLOTS.indexOf(endSlot));
  const start = BOARD_SLOTS[lo];
  // Only pass an explicit end when a real drag happened (more than one slot
  // selected) — a plain click keeps openBookingDialog's own ~1 hour default.
  const end = hi > lo ? slotEnd(BOARD_SLOTS[hi]) : undefined;
  openBookingDialog(room, start, end);
}
function openBookingDialog(room, start, end){
  // Uses isLocked() (not guardEdit()) deliberately: opening the dialog isn't
  // itself a data change, so it shouldn't write an audit entry. guardEdit()
  // runs (and logs, if applicable) once the booking is actually submitted.
  if(isLocked()){
    alert('마감된 일지입니다. 관리자만 예약을 추가할 수 있습니다.');
    return;
  }
  bookingDialog = { room, start, end };
  render();
}
function closeBookingDialog(){
  bookingDialog = null;
  render();
}
function submitBooking(){
  if(!bookingDialog) return;
  const { room, start } = bookingDialog;
  if(!guardEdit()){ bookingDialog = null; return; }
  const nameEl = document.getElementById('bookingCustomer');
  const phoneEl = document.getElementById('bookingPhone');
  const endEl = document.getElementById('bookingEnd');
  const name = nameEl.value.trim();
  const phone = phoneEl.value.trim();
  const end = endEl.value;
  if(!name){ alert('예약자 이름을 입력하세요.'); return; }
  const visits = state.log.rooms[room];
  const conflict = visits.some(v=>v.bookingStart && v.bookingEnd && start < v.bookingEnd && end > v.bookingStart);
  if(conflict){ alert('선택한 시간대에 이미 다른 예약이 있습니다. 시간을 다시 선택해주세요.'); return; }
  visits.push({ id:uid(), customer:name, phone, payments:[], birdieCount:0, bookingStart:start, bookingEnd:end, createdBy: session?session.name:'' });
  bookingDialog = null;
  persistAndRender(); // structural: a new booking should land on the board for everyone immediately
}
// Edits an existing visit's booking range directly from the room panel (not
// just via the board's create dialog), keeping both views in sync. Rejects
// the change with an alert if it would overlap another visit's occupied time.
function setBookingRange(room, visitId, field, value){
  if(!guardEdit()) return;
  const v = getVisit(room, visitId);
  if(field==='start' && value===''){
    delete v.bookingStart;
    delete v.bookingEnd;
    markDirty(visitId);
    return;
  }
  let newStart = field==='start' ? value : v.bookingStart;
  let newEnd = field==='end' ? value : v.bookingEnd;
  if(!newEnd || newEnd <= newStart) newEnd = slotEnd(newStart);
  const conflict = state.log.rooms[room].some(other =>
    other.id!==visitId && other.bookingStart && other.bookingEnd &&
    newStart < other.bookingEnd && newEnd > other.bookingStart
  );
  if(conflict){
    alert('이미 다른 손님이 점유하고 있는 시간입니다. 다른 시간을 선택해주세요.');
    render(); // revert the <select> back to the real (unchanged) value
    return;
  }
  v.bookingStart = newStart;
  v.bookingEnd = newEnd;
  markDirty(visitId);
}
// Clicking a booked slot on the board jumps to that visit's card in the room
// panel below and expands only it — every other card in that room folds, so

}

// Per-keystroke variant: updates state and the range warning without a full

// ---------- calculations ----------
function computeSummary(log){
  const totals = {cash:0, card:0, transfer:0};
  const roomTotals = {};
  let sgTotal = 0;
  let birdieTotal = 0;
  let birdieCountSum = 0;

  ROOMS.forEach(r=>{
    roomTotals[r] = {cash:0, card:0, transfer:0};
    (log.rooms[r]||[]).forEach(v=>{
      v.payments.forEach(p=>{
        if(p.type==='HOLE') sgTotal += Number(p.amount)||0;
        roomTotals[r][p.method] += Number(p.amount)||0;
        totals[p.method] += Number(p.amount)||0;
      });
      const bc = Number(v.birdieCount)||0;
      birdieCountSum += bc;
      birdieTotal += bc*100;
    });
  });

  const practiceTotals = {cash:0, card:0, transfer:0};
  (log.practice||[]).forEach(p=>{
    practiceTotals[p.method] += Number(p.amount)||0;
    totals[p.method] += Number(p.amount)||0;
  });

  const grandTotal = totals.cash + totals.card + totals.transfer;
  return { totals, roomTotals, sgTotal, birdieTotal, birdieCountSum, practiceTotals, grandTotal };
}

// ---------- render ----------
function render(){
  document.getElementById('header').innerHTML = renderHeader();
  const app = document.getElementById('app');
  if(!session){ app.innerHTML = renderLogin(); return; }
  if(state.view==='admin' && !isAdmin()) state.view = 'edit'; // staff can't reach the admin page
  if(state.view==='list' && !isAdmin()) state.view = 'edit'; // 조회/통계 is admin-only
  if(state.view==='edit' && !state.log){ app.innerHTML = '<p style="padding:20px;color:#888;">불러오는 중...</p>'; return; }
  if(state.view==='list' && !state.listData){ app.innerHTML = '<p style="padding:20px;color:#888;">불러오는 중...</p>'; return; }
  if(state.view==='admin' && !state.adminData){ app.innerHTML = '<p style="padding:20px;color:#888;">불러오는 중...</p>'; return; }
  if(state.view==='edit') app.innerHTML = renderEditView();
  else if(state.view==='list') app.innerHTML = renderListView();
  else if(state.view==='admin') app.innerHTML = renderAdminView();
  else if(state.view==='manual') app.innerHTML = renderManualView();
}
// ---------- mobile sliding menu (hamburger) ----------

function closeMobileMenu(){ mobileMenuOpen = false; render(); }
function selectMobileView(key){
  mobileMenuOpen = false;

  // away, otherwise state.log is stale and the next save writes that stale
  // copy over the server — the loop that kept making saved info disappear.
  if(key==='edit'){ state.view='edit'; applyPendingRemote(); render(); }
  else if(key==='list'){ openListView(); }
  else if(key==='admin'){ openAdminView(); }
  else if(key==='manual'){ state.view='manual'; render(); }
}

async function openListView(){
  const myGen = ++loadGeneration;
  state.view = 'list';
  state.listData = null;
  render();
  try{
    const snap = await db.collection('logs').get();
    if(myGen !== loadGeneration) return;
    const logsByDate = {};
    snap.forEach(doc => logsByDate[doc.id] = normalizeLog(doc.data()));
    state.listData = { dates: Object.keys(logsByDate).filter(d=>/^\d{4}-\d{2}-\d{2}$/.test(d)).sort(), logsByDate };
  }catch(e){
    if(myGen !== loadGeneration) return;

// Walks the 30-min slots left to right and merges consecutive slots that
// belong to the same booking into one wide cell (colspan) so the
// reservation's name is shown once across its full occupied span, not
// truncated per-slot.
function renderBoardRow(room, visits, occupiedColor){
  let html = '';
  let i = 0;
  while(i < BOARD_SLOTS.length){
    const slot = BOARD_SLOTS[i];
    const owner = visits.find(v=>v.bookingStart && v.bookingEnd && slot >= v.bookingStart && slot < v.bookingEnd);
    if(owner && slot === owner.bookingStart){
      const span = Math.max(1, Math.round((toMinutes(owner.bookingEnd) - toMinutes(owner.bookingStart)) / 30));
      const tip = `${owner.customer||''}${owner.phone?' ☎'+owner.phone:''} (${owner.bookingStart}~${owner.bookingEnd})`;
      html += `<td class="board-cell occupied" colspan="${span}" style="background:${occupiedColor};" title="${escAttr(tip)}" onclick="focusVisitFromBoard('${room}','${owner.id}')">${escHtml(owner.customer||'')}</td>`;
      i += span;
    } else if(owner){
      // Defensive fallback for pre-existing overlapping data; normal use never reaches this.
      html += `<td class="board-cell occupied" style="background:${occupiedColor};" title="${escAttr(owner.customer||'')}" onclick="focusVisitFromBoard('${room}','${owner.id}')"></td>`;
      i += 1;
    } else {
      html += `<td class="board-cell free" data-room="${room}" data-slot="${slot}" title="${slot} 예약하기(드래그로 시간대 선택 가능)" onmousedown="event.preventDefault();startBoardDrag('${room}','${slot}')" onmouseenter="extendBoardDrag('${room}','${slot}')"></td>`;
      i += 1;
    }
  }
  return html;
}

// ---------- list / stats view ----------
function renderListView(){
  const { dates, logsByDate } = state.listData;

  }
  const monthDates = dates.filter(d=>d.startsWith(state.listMonth));

  let monthTotals = {cash:0,card:0,transfer:0};
  let monthSg=0, monthBirdie=0;
  const rows = monthDates.map(d=>{
    const log = logsByDate[d];
    const s = computeSummary(log);
    monthTotals.cash+=s.totals.cash; monthTotals.card+=s.totals.card; monthTotals.transfer+=s.totals.transfer;
    monthSg += s.sgTotal; monthBirdie += s.birdieTotal;
    return `<tr>
      <td class="label"><a href="#" onclick="loadDateIntoEditor('${d}');return false;">${d.slice(5)} (${weekdayLabel(d)})</a> ${log.closed?'🔒':''}</td>

      <td><b>${fmt(s.grandTotal)}</b></td>

  }).join('');

  return `
    ${renderNav()}
    <div class="topbar">
      <label>월 선택</label>
      <select class="month-select" onchange="state.listMonth=this.value;render()">
        ${months.map(m=>`<option value="${m}" ${m===state.listMonth?'selected':''}>${m}</option>`).join('')}

      <h2 style="font-size:15px;margin-top:0;">${state.listMonth} 일별 매출</h2>
      <table>
        <tr><th class="label">날짜</th><th>현금</th><th>카드</th><th>이체</th><th>합계</th></tr>
        ${rows || '<tr><td colspan="5" style="text-align:center;color:#999;">저장된 일지가 없습니다</td></tr>'}
        <tr class="grand-row"><td class="label">월 합계</td><td>${fmt(monthTotals.cash)}</td><td>${fmt(monthTotals.card)}</td><td>${fmt(monthTotals.transfer)}</td><td>${fmt(monthTotals.cash+monthTotals.card+monthTotals.transfer)}</td></tr>
      </table>
    </div>

    <div class="list-table-wrap">
      <h2 style="font-size:15px;margin-top:0;">${state.listMonth} 기타 집계</h2>
      <table>
        <tr><th class="label">SG(홀인원 응모) 총액</th><td>${fmt(monthSg)}원</td></tr>
        <tr><th class="label">버디 지급 총액</th><td>${fmt(monthBirdie)}원</td></tr>
      </table>
    </div>
  `;
}

async function loadDateIntoEditor(date){
  if(!confirmDiscardIfDirty()) return;
  clearDirty();
  const myGen = ++loadGeneration;
  state.currentDate = date;
  state.log = null;
  state.view = 'edit';
  render();
  try{
    const log = await loadLog(date); // fresh read, not the list-view snapshot — another device may have changed it since
    if(myGen !== loadGeneration) return;
    state.log = log;
    setBase(log);
    subscribeLog(date);
  }catch(e){
    if(myGen !== loadGeneration) return;
    alert('일지를 불러오지 못했습니다. 인터넷 연결을 확인하고 다시 시도해주세요.');
    state.view = 'list'; // back to a view that still has state.listData, rather than stranding on a blank editor
  }
  render();
}
async function deleteDateRow(date){
  let log;
  try{
    log = await loadLog(date); // fresh read, not the list-view snapshot
  }catch(e){
    alert('일지 상태를 확인하지 못했습니다. 인터넷 연결을 확인하고 다시 시도해주세요.');
    return;
  }
  if(log.closed && !isAdmin()){
    alert('마감된 일지는 관리자만 삭제할 수 있습니다.');
    return;
  }
  if(!confirm(`${date} 일지를 삭제할까요? 되돌릴 수 없습니다.`)) return;
  addAudit(date, 'DELETE', '일지 전체 삭제');
  await deleteLogDate(date);
  state.listData.dates = state.listData.dates.filter(d=>d!==date);
  delete state.listData.logsByDate[date];
  render();
}

// ---------- admin view ----------
const MAX_EXPORT_DAYS = 31; // "최대 1개월치" cap on a single range export
function dateRange(start, end){
  const dates = [];
  const cur = new Date(start + 'T00:00:00');
  const endD = new Date(end + 'T00:00:00');
  const pad = n => String(n).padStart(2,'0');
  while(cur <= endD){
    dates.push(`${cur.getFullYear()}-${pad(cur.getMonth()+1)}-${pad(cur.getDate())}`);
    cur.setDate(cur.getDate()+1);
  }
  return dates;
}
// One sheet's worth of rows for a single date: visit/payment detail rows,
// then a blank separator, then the same room/method summary shown on-screen.
function buildDateSheetRows(log, summary){
  const rows = [['룸','예약시간','예약자','연락처','항목','결제수단','금액','메모']];
  ROOMS.forEach(room=>{
    (log.rooms[room]||[]).forEach(v=>{
      const time = v.bookingStart ? `${v.bookingStart}~${v.bookingEnd}` : '';
      if(v.payments.length===0){
        rows.push([ROOM_LABEL[room]||room, time, v.customer||'', v.phone||'', '', '', '', '']);
      } else {
        v.payments.forEach(p=>{
          rows.push([ROOM_LABEL[room]||room, time, v.customer||'', v.phone||'', payTypeLabel(p.type), methodLabel(p.method), Number(p.amount)||0, p.memo||'']);
        });
      }
    });
  });
  rows.push([]);
  rows.push(['요약','현금','카드','이체','합계']);
  ROOMS.forEach(r=>{
    const rt = summary.roomTotals[r];
    const tot = rt.cash+rt.card+rt.transfer;
    if(tot===0) return;
    rows.push([ROOM_LABEL[r]||r, rt.cash, rt.card, rt.transfer, tot]);
  });
  rows.push(['연습장 매출', summary.practiceTotals.cash, summary.practiceTotals.card, summary.practiceTotals.transfer, summary.practiceTotals.cash+summary.practiceTotals.card+summary.practiceTotals.transfer]);
  rows.push(['총 수입 합계', summary.totals.cash, summary.totals.card, summary.totals.transfer, summary.grandTotal]);
  rows.push([]);
  rows.push(['SG(홀인원 응모) 총액', summary.sgTotal]);
  rows.push(['버디 지급 총액', summary.birdieTotal, `총 ${summary.birdieCountSum}개`]);
  return rows;
}
async function exportRangeToExcel(start, end){
  if(!start || !end){ alert('시작일과 종료일을 선택하세요.'); return; }
  if(start > end){ alert('종료일이 시작일보다 빠를 수 없습니다.'); return; }
  const dates = dateRange(start, end);
  if(dates.length > MAX_EXPORT_DAYS){
    alert(`한 번에 최대 ${MAX_EXPORT_DAYS}일(약 1개월)까지만 받을 수 있습니다. 기간을 줄여주세요.`);
    return;
  }
  const wb = XLSX.utils.book_new();
  try{
    for(const date of dates){
      const log = await loadLog(date);
      const summary = computeSummary(log);
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(buildDateSheetRows(log, summary)), date);
    }
  }catch(e){
    alert('일지를 불러오지 못해 엑셀 출력을 중단했습니다. 인터넷 연결을 확인하고 다시 시도해주세요.');
    return;
  }
  const filename = start === end ? `${start}_스크린골프정산.xlsx` : `${start}~${end}_스크린골프정산.xlsx`;
  XLSX.writeFile(wb, filename);
}

// Paged 변경 이력: AUDIT_PAGE_SIZE rows at a time, newest first.
function renderAuditSection(audit){
  const total = audit.length;
  const pageCount = Math.max(1, Math.ceil(total / AUDIT_PAGE_SIZE));
  // Clamp in case the list shrank since the page index was last set.
  const page = Math.min(Math.max(0, state.auditPage), pageCount - 1);
  state.auditPage = page;
  const start = page * AUDIT_PAGE_SIZE;
  const rows = audit.slice(start, start + AUDIT_PAGE_SIZE);
  return `
    <div class="list-table-wrap">
      <h2 style="font-size:15px;margin-top:0;">📜 변경 이력 (예약 카드 저장 · 삭제)</h2>
      <p style="font-size:12px;color:#888;margin:0 0 8px;">최근 1개월치만 보관되며, 그보다 오래된 기록은 자동으로 삭제됩니다.</p>
      <table>
        <tr><th class="label">시각</th><th class="label">작업자</th><th class="label">종류</th><th class="label">내용</th></tr>
        ${rows.length ? rows.map(a=>`
          <tr>
            <td class="label">${new Date(a.ts).toLocaleString('ko-KR')}</td>
            <td class="label">${escHtml(a.who || '-')}</td>
            <td class="label">${escHtml(AUDIT_TYPE_LABEL[a.type] || a.type)}</td>
            <td class="label">${escHtml(a.detail || '')}</td>
          </tr>
        `).join('') : '<tr><td colspan="4" style="text-align:center;color:#999;">기록 없음</td></tr>'}
      </table>
      ${total ? `
        <div class="audit-pager">
          <button class="btn small" ${page===0?'disabled':''} onclick="gotoAuditPage(${page-1})">← 이전</button>
          <span>${page+1} / ${pageCount} 페이지 (총 ${total}건)</span>
          <button class="btn small" ${page>=pageCount-1?'disabled':''} onclick="gotoAuditPage(${page+1})">다음 →</button>
        </div>
      ` : ''}
    </div>
  `;
}
function gotoAuditPage(p){
  state.auditPage = p;
  render();
}

// ---------- escaping ----------
function escHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return escHtml(s); }

(async function init(){
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  try{
    await ensureAdminHash();
    try{
      const saved = sessionStorage.getItem(SESSION_KEY);
      if(saved) session = JSON.parse(saved);
    }catch(e){ session = null; }
    state.log = await loadLog(state.currentDate);
    setBase(state.log);
    subscribeLog(state.currentDate);
    render();
  }catch(e){
    console.warn('초기 로딩 실패:', e);
    document.getElementById('header').innerHTML = '<h1>🏌️ 대성스크린골프 일지 관리</h1>';
    document.getElementById('app').innerHTML =
      '<div class="summary"><p>서버에 연결하지 못했습니다. 인터넷 연결을 확인해주세요.</p>' +
      '<button class="btn primary" onclick="location.reload()">다시 시도</button></div>';
  }
  document.addEventListener('mouseup', ()=>{ if(boardDrag) finishBoardDrag(); });
  // Bound on document (not per-cell) so they survive every re-render.
  // touchmove MUST be non-passive: preventDefault() there is what stops the
  // page and the board from scrolling while a selection is being dragged.
  document.addEventListener('touchstart', onBoardTouchStart, { passive: true });
  document.addEventListener('touchmove',  onBoardTouchMove,  { passive: false });
  document.addEventListener('touchend',   onBoardTouchEnd);
  document.addEventListener('touchcancel', onBoardTouchEnd);
})();
</script>
